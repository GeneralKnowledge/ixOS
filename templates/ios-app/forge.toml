[app]
name = "FORGE_APP_NAME"
bundle_id = "FORGE_BUNDLE_ID"
minimum_ios = "17.0"
# display_name = "FORGE_APP_NAME"   # home-screen name (default: name)
version = "1.0.0"                   # CFBundleShortVersionString
build_number = "1"                  # CFBundleVersion; raise it for every upload

[rust]
# This app's own Rust crate: logic, state, persistence, networking.
path = "rust"

[build]
ios_device = true
ios_simulator = false

# The app's Swift module names: its bindings (Generated/ForgeFFI) and its
# views and models (Sources/AppHost). Named after the app, so another app
# can host this one (docs/app-crate.md).
[swift]
bindings_module = "FORGE_MODULE_NAMEFFI"
app_module = "FORGE_MODULE_NAMEApp"

# iOS settings. Forge writes Info.plist, App.entitlements and xtool.yml from
# this section on every `forge build ios` / `forge run ios` (or `forge config
# sync`), so edit them here, not in those files. All keys: docs/app-config.md.
[ios]
# The SwiftPM product xtool builds (Package.swift). It is the app's executable,
# so it names the process in `forge device logs --process` and crash reports.
xtool_product = "FORGE_PACKAGE_NAMEXtool"
# icon = "Resources/AppIcon.png"    # 1024x1024 PNG
orientations = ["portrait"]
# url_schemes = ["myapp"]           # opens myapp://... links
# background_modes = ["remote-notification"]

# The text iOS shows when the app asks for a permission.
[ios.permissions]
# camera = "Scan barcodes to add items."
# photo_library = "Attach photos to your notes."
# location_when_in_use = "Show places near you."

[ios.entitlements]
# app_groups = ["group.FORGE_BUNDLE_ID"]
# associated_domains = ["applinks:example.com"]   # paid team
# push_notifications = "development"              # paid team

[ios.signing]
# team_type = "free"                # "free" (Apple ID) or "paid" (Developer Program)
# team_id = "ABCDE12345"            # for the Xcode project (macOS, optional)
