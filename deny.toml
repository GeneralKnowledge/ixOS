# cargo-deny configuration (run: cargo deny check). CI runs it on every PR.

[graph]
all-features = true

[advisories]
# Vulnerabilities anywhere in the tree fail. "Unmaintained" notices fail only for
# our direct dependencies: the current ones (basic-toml, bincode, paste) come in
# through uniffi's binding generator and go away when uniffi is upgraded.
unmaintained = "workspace"
ignore = []

[licenses]
# Compatible with this project's MIT OR Apache-2.0 license.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
# Licenses we would accept but no dependency uses yet.
unused-allowed-license = "allow"

# Mozilla's CA bundle as data. Only reached on wasm32 (via
# rustls-platform-verifier, used by forge-net's `ureq` feature); every mobile
# and desktop target uses the OS trust store instead.
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

# The same CA bundle, for the Linux CLI only: forge-uitest (via idevice's
# `tss` feature) calls Apple's TSS server over HTTPS to personalise the
# Developer Disk Image for a phone. Never compiled into an app.
[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
