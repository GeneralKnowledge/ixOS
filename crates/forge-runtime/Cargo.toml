[package]
name = "forge-runtime"
version = "0.1.0"
description = "What every Forge app's Rust library needs at the FFI boundary: async commands without an async runtime, bounded event subscriptions, and the Android platform init"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
forge-net = { workspace = true, features = ["ureq"] }
# The logging facade (src/logging.rs); its macros are re-exported, so apps
# need no direct dependency.
log = { version = "0.4", features = ["std"] }

[target.'cfg(not(target_os = "ios"))'.dependencies]
# Only for the `ForgeAndroid.nativeInit` JNI export (src/jni_init.rs); the
# version must match the one forge-net's Android verifier init takes.
jni = { version = "0.22", default-features = false }

[dev-dependencies]
# Same pin as the Counter crate's model tests.
proptest = "=1.12.0"
