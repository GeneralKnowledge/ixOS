[package]
name = "forge-app"
version = "0.5.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The ixOS application runtime: one core per process, serial commands, revisions, lifecycle, cancellation, shutdown, the shared contract types, and the document and validation foundations"
publish = false

[lib]
name = "forge_app"
# A plain library only. Every app links it into its own static library, and a
# cdylib here would be linked too when an app builds for iOS, which needs an
# Apple linker a Linux host does not have. scripts/forgekit.sh builds the
# cdylib it generates ForgeKit's Swift from with `cargo rustc --crate-type cdylib`.

[dependencies]
forge-runtime = { workspace = true }
# The `document` module is a JsonFile with the app-level rules on top.
forge-storage = { workspace = true }
serde = { workspace = true }
# The one framework crate that is a UniFFI component (docs/ffi-policy.md):
# its contract types appear in every app's API, as external types, and their
# Swift ships in ForgeKit. No `cli` feature: apps generate bindings.
uniffi = "=0.32.2"

[dev-dependencies]
serde_json = { workspace = true }
tempfile = "3.14"
