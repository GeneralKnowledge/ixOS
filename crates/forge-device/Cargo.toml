[package]
name = "forge-device"
version = "0.1.0"
description = "Developer access to a connected iPhone from Linux: device info, system log, crash reports and the live connection to development builds, over usbmuxd"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# Talks to the phone's lockdown services through usbmuxd (no iOS 17 tunnel
# needed for M0). Exact pin: idevice is pre-1.0 and breaks between releases.
# `ring` instead of the default aws-lc keeps the build free of cmake and C.
idevice = { version = "=0.1.68", default-features = false, features = [
    "ring",
    "usbmuxd",
    "syslog_relay",
    "crashreportcopymobile",
] }
tokio = { version = "1", features = ["rt", "net", "time", "io-util"] }
plist = "1"
# Only for the `ax_probe` spike (`--features ax-probe`): Apple's accessibility
# audit service speaks DTX after a TLS handshake that is then dropped.
ns-keyed-archive = { version = "0.1.5", optional = true }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"], optional = true }
thiserror = { workspace = true }
forge-devproto = { path = "../forge-devproto" }

[features]
# Spike: probe Apple's accessibility audit service (docs/research/ax-audit.md).
ax-probe = ["idevice/dvt", "dep:ns-keyed-archive", "dep:rustls", "dep:tokio-rustls", "tokio/signal", "tokio/macros"]

[[example]]
name = "ax_probe"
required-features = ["ax-probe"]

[dev-dependencies]
# The ax_probe spike's --json report.
serde_json = { workspace = true }
forge-devtools = { path = "../forge-devtools" }
forge-runtime = { workspace = true }
tempfile = "3.14"
