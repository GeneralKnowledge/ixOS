[package]
name = "forge-ffi"
version = "0.1.0"
description = "UniFFI boundary for Forge Mobile"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["staticlib", "cdylib", "lib"]
name = "forge_ffi"

[dependencies]
forge-core = { workspace = true }
forge-storage = { workspace = true }
forge-net = { workspace = true, features = ["ureq"] }
chat-core = { workspace = true, features = ["ureq"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uniffi = { workspace = true }

[target.'cfg(not(target_os = "ios"))'.dependencies]
# Only for the `ForgeAndroid.nativeInit` JNI export (src/jni_init.rs); the
# version must match the one forge-net's Android verifier init takes.
jni = { version = "0.22", default-features = false }

[dev-dependencies]
tempfile = "3.14"
