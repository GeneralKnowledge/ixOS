[package]
name = "forge-storage"
version = "0.1.0"
description = "Portable persistence for Forge Mobile"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
# An embedded SQLite database ([`Database`]): migrations, transactions,
# full-text search (FTS5) and corrupt-file recovery. SQLite is compiled from
# source (rusqlite's `bundled`), so iOS and Android need no system library.
sqlite = ["dep:rusqlite"]
# Content-addressed files in a FileStore: import_hashed names a file by the
# SHA-256 of its bytes, accept_verified keeps a download only if it matches.
hash = ["dep:sha2"]
# CSV import and export of any serde type (`csv_file`).
csv = ["dep:csv"]
# Backup archives of an app's data, checked on restore (`backup`).
backup = ["dep:zip", "hash"]

[dependencies]
rusqlite = { version = "0.41", features = ["bundled"], optional = true }
serde = { workspace = true }
sha2 = { version = "0.10", optional = true }
csv = { version = "1.3", optional = true }
zip = { version = "9.4", default-features = false, features = ["deflate"], optional = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3.14"

# Foundation review tests (docs/foundation-review.md): crash, recovery and
# consistency checks that need SQLite and hashing.
[[test]]
name = "foundation"
required-features = ["sqlite", "hash"]

[[test]]
name = "backup_and_csv"
required-features = ["sqlite", "csv", "backup"]
