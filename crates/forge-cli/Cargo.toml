[package]
name = "forge-cli"
version = "0.1.0"
description = "Forge Mobile developer CLI"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "forge"
path = "src/main.rs"

[dependencies]
# `forge device`: phone info, logs and crash reports over usbmuxd.
forge-device = { path = "../forge-device" }
# `forge ui`: UI tests on a connected iPhone through XCTest and WebDriverAgent.
forge-uitest = { path = "../forge-uitest" }
# `forge crash` and `device crashes --pull`: symbolicated crash reports.
forge-crash = { path = "../forge-crash" }
clap = { version = "=4.6.10", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "1.1"
thiserror = { workspace = true }
# Evidence bundles record a SHA-256 of each file they list.
sha2 = "0.11"
# `forge publish ios`: read the signed .ipa's Info.plist and profile, and
# write the over-the-air install manifest.
zip = { version = "9.4", default-features = false, features = ["deflate"] }
plist = "1"

[target.'cfg(unix)'.dependencies]
# `--json`: points fd 1 at stderr so only the result reaches stdout.
libc = "0.2"

[dev-dependencies]
tempfile = "3.14"
# Parses the JUnit XML in tests with a real XML parser.
roxmltree = "0.21"
forge-runtime = { workspace = true }

[package.metadata.forge]
# Project area (docs/areas.md), checked by scripts/check-boundaries.sh.
area = "tools"

[lints]
workspace = true
