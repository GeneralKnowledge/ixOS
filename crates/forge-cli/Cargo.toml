[package]
name = "forge-cli"
version = "0.1.0"
description = "Forge Mobile developer CLI"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "forge"
path = "src/main.rs"

[dependencies]
# `forge device`: phone info, logs and crash reports over usbmuxd.
forge-device = { path = "../forge-device" }
# `forge device pair/connect/...`: the live connection's protocol.
forge-devproto = { path = "../forge-devproto" }
# `forge ui`: UI tests on a connected iPhone through XCTest and WebDriverAgent.
forge-uitest = { path = "../forge-uitest" }
# `forge mcp`: the MCP server for coding agents.
forge-mcp = { path = "../forge-mcp" }
# `forge crash` and `device crashes --pull`: symbolicated crash reports.
forge-crash = { path = "../forge-crash" }
clap = { version = "=4.6.7", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "1.1"
thiserror = { workspace = true }
# Evidence bundles record a SHA-256 of each file they list.
sha2 = "0.11"

[target.'cfg(unix)'.dependencies]
# `--json`: points fd 1 at stderr so only the result reaches stdout.
libc = "0.2"

[dev-dependencies]
tempfile = "3.14"
# The CLI's live-connection tests run against the real app-side server.
forge-devtools = { path = "../forge-devtools" }
forge-runtime = { workspace = true }
