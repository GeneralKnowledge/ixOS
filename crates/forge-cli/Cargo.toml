[package]
name = "forge-cli"
version = "0.1.0"
description = "Forge Mobile developer CLI"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "forge"
path = "src/main.rs"

[dependencies]
# `forge device`: phone info, logs and crash reports over usbmuxd.
forge-device = { path = "../forge-device" }
clap = { version = "=4.6.7", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "1.1"
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3.14"
