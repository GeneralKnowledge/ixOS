# Soundscape's own Rust library: the music library, collection, offline
# copies, queue, catalogues (Jamendo, Internet Archive) and the UniFFI API
# (SoundscapeCore) the SwiftUI app calls. AVPlayer plays; this crate owns the
# state and the rules. Built the way a hostable app is
# (docs/research/app-friction-log.md).
[package]
name = "soundscape-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[lib]
name = "soundscape_core"
crate-type = ["staticlib", "lib"]

[dependencies]
# The application runtime: one core per process, serial commands, revisions,
# lifecycle, cancellation, shutdown (docs/app-model-review.md).
forge-app = { path = "../../../crates/forge-app" }
forge-runtime = { path = "../../../crates/forge-runtime" }
# The library and the rest are JSON documents; imported music and artwork
# are files named by their SHA-256.
forge-storage = { path = "../../../crates/forge-storage", features = ["hash"] }
# Listen: the take server's API through URLSession on iOS (ureq in Linux
# tests), so it follows the phone's VPN (Tailscale).
forge-net = { path = "../../../crates/forge-net", features = ["ureq"] }
forge-services = { path = "../../../crates/forge-services", features = ["http"] }
serde_json = "1.0"
# The native_services! macro expands to async traits.
async-trait = "0.1"
# Must match the uniffi-bindgen Forge generates bindings with.
uniffi = "=0.32.2"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
# Jamendo covers are compared by their SHA-256 (jamendo_explore).
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.14"

# Its own workspace, like every app made with `forge init`.
[workspace]

[profile.release]
lto = true
codegen-units = 1

# App code has no unsafe Rust; UniFFI's generated scaffolding passes this too.
[lints.rust]
unsafe_code = "forbid"
