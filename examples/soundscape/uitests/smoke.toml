# Smoke test: the app opens on the library, and Discover opens from it.
# Uses a temporary data folder, so the library is empty.
# Run with the phone plugged in:  forge ui run uitests/smoke.toml
name = "Smoke: library, then Discover"
app = "org.forgemobile.agentlab"

[[step]]
terminate = {}

[[step]]
launch = { args = ["-ForgeTemporaryData"] }

[[step]]
expect = { id = "library.discover" }

[[step]]
screenshot = "1-library"

[[step]]
tap = { id = "library.discover" }

[[step]]
expect = { id = "discover.source" }

[[step]]
screenshot = "2-discover"
