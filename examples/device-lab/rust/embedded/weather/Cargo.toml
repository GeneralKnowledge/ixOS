# Weather's Rust crate, compiled a second time as a library of the Device Lab
# showcase. The source is examples/weather/rust/src, unchanged; only the library
# name differs. Forge apps all call their library forge_ffi, so two app
# crates can't be linked into one app under their own manifests
# (docs/research/showcase-friction-log.md, F1). Keep [dependencies] in step
# with examples/weather/rust/Cargo.toml: a missing one fails the build.
[package]
name = "weather-embedded"
version = "0.1.0"
edition = "2021"
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
# The UniFFI namespace follows the library name (setup_scaffolding!() with no
# argument), so these bindings become their own Swift file in ForgeFFI.
name = "weather_core"
path = "../../../../weather/rust/src/lib.rs"

[dependencies]
forge-net = { path = "../../../../../crates/forge-net", features = ["ureq"] }
forge-storage = { path = "../../../../../crates/forge-storage" }
forge-runtime = { path = "../../../../../crates/forge-runtime" }
uniffi = "=0.32.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
