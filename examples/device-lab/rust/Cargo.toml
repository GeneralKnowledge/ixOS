# Device Lab's Rust library: what runs when, and the app's view of the live
# device values (histories, rates, peaks, distance). The UniFFI API the SwiftUI
# host calls; `forge build` rebuilds it and regenerates the bindings.
[package]
name = "device-lab-core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# The library and UniFFI namespace keep Forge's fixed names (libforge_ffi.a /
# libforge_ffi.so, Swift module ForgeFFI, Kotlin package uniffi.forge_ffi), so
# the build scripts and host projects never need renaming.
name = "forge_ffi"
crate-type = ["staticlib", "cdylib", "lib"]

[dependencies]
# Forge's runtime crates, from the Forge checkout this app was created with.
forge-runtime = { path = "../../../crates/forge-runtime" }
# Native services, with the optional connectivity, device status, motion,
# location, Bluetooth and background transfer services selected in
# src/lib.rs. See docs/native-services.md.
forge-services = { path = "../../../crates/forge-services", features = ["transfers"] }
# The folder background downloads are delivered into.
forge-storage = { path = "../../../crates/forge-storage" }
thiserror = "2"
# Must match the uniffi-bindgen Forge generates bindings with.
uniffi = "=0.32.2"
# UniFFI's generated code for async host interfaces names it directly.
async-trait = "0.1"
# The other apps of the showcase: their own Rust crates, linked into this
# library so one app runs all of them (src/lib.rs, the Apps screen). Each
# names its library after itself (weather_core, ...), which keeps them apart.
weather-app = { path = "../../weather/rust" }
checklist-core = { path = "../../checklist/rust" }
pocket-library-core = { path = "../../pocket-library/rust" }

[dev-dependencies]
tempfile = "3.14"

# Its own workspace: the app builds the same inside or outside the Forge checkout.
[workspace]

[profile.release]
# Smaller app binaries; Rust panics still reach the host as errors via UniFFI.
lto = true
codegen-units = 1
