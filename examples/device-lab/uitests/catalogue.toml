# The screenshot catalogue: every hosted app's first screen, light and dark,
# full screen in Device Lab on throwaway data, so a redesign can be compared
# with the screen before it (docs/visual-regression.md).
#
#   forge ui run examples/device-lab/uitests/catalogue.toml            compare
#   forge ui run examples/device-lab/uitests/catalogue.toml --visual record
#
# Each launch opens one app (-launchApp) on empty throwaway data
# (-ForgeTemporaryData), so your own books, notes and messages never appear
# and the screens are the same every run. The workshop button is masked:
# it floats over the app and isn't part of it. Baselines are approved with
# `forge ui accept` after a person has looked at them (uitests/baselines/).
# About 3 minutes on the phone.

name = "Catalogue: every app's first screen, light and dark"
app = "org.forgemobile.devicelab"

[visual]
mask = [{ id = "workshop.menu" }]

[[step]]
launch = { args = ["-ForgeTemporaryData", "-launchApp", "weather", "-ForgeAppearance", "light"] }

[[step]]
expect = { id = "workshop.menu" }

[[step]]
settle = {}

[[step]]
screenshot = "weather"

[[step]]
launch = { args = ["-ForgeTemporaryData", "-launchApp", "weather", "-ForgeAppearance", "dark"] }

[[step]]
expect = { id = "workshop.menu" }

[[step]]
settle = {}

[[step]]
