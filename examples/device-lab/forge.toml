[app]
name = "DeviceLab"
bundle_id = "org.forgemobile.devicelab"
minimum_ios = "17.0"
display_name = "Device Lab"         # home-screen name
version = "1.0.0"                   # CFBundleShortVersionString
build_number = "1"                  # CFBundleVersion; raise it for every upload

[rust]
# This app's own Rust crate. It selects Forge's optional native services
# (connectivity, device status, motion, location, Bluetooth) in src/lib.rs.
path = "rust"

[build]
ios_device = true
ios_simulator = false

# iOS settings. Forge writes Info.plist, App.entitlements and xtool.yml from
# this section on every `forge build ios` / `forge run ios` (or `forge config
# sync`), so edit them here, not in those files. All keys: docs/app-config.md.
[ios]
devices = ["iphone"]
orientations = ["portrait"]
icon = "Resources/AppIcon.png"    # 1024x1024 PNG, no transparency
# Pocket Library's "Read the Whole Book" runs on as a continued-processing
# task named after the host's bundle id (with and without xtool's
# XTL-<team>. prefix); see examples/pocket-library/forge.toml.
background_tasks = [
    "org.forgemobile.devicelab.booksummary.*",
    "XTL-ND4P87PX52.org.forgemobile.devicelab.booksummary.*",
]

# The apps on the Apps screen. Forge merges their iOS settings into this
# app's when it reads this file: Pocket Library's audio background mode,
# Relay's forgechat:// scheme (its Chats), their permission texts (a text below wins) and
# their test-data arguments. Every app now honours both -ForgeTemporaryData
# and -ForgeUITestData, so either one starts them all on throwaway data.
# See docs/app-config.md.
[host]
apps = ["../weather", "../checklist", "../pocket-library", "../good-dog", "../commonplace", "../fieldkit", "../sketchbook", "../soundscape", "../relay", "../sums"]

# The text iOS shows when the app asks. Each one is asked only when the user
# taps the matching "Allow" button on the dashboard.
[ios.permissions]
location_when_in_use = "Device Lab shows your position, altitude, speed and true-north heading while it is open, Weather uses it for the forecast where you are, and FieldKit records a trip's track until you stop it, also with the phone locked. Nothing else leaves your phone."
motion = "Device Lab reads the barometer for air pressure and height changes."
bluetooth = "Device Lab shows whether Bluetooth is on. It does not connect to anything."
# Four hosted apps use the local network, and two the microphone; one
# text for each.
local_network = "Relay connects to your chat server and finds your paired devices and sends to them, Commonplace reads feeds, and Soundscape plays song takes from your computer, on your local network."
microphone = "Relay records voice messages for you to send, and Soundscape records the loops you layer, which stay on this phone."
camera = "Relay scans another device's pairing code."

[ios.signing]
# Everything here works with a free Apple account: no paid-only entitlements.
team_type = "free"

[ios.info]
# Files received with a code go to Documents/Relay; these two keys show
# Documents in the Files app (On My iPhone), so files Relay receives are
# there.
UIFileSharingEnabled = true
LSSupportsOpeningDocumentsInPlace = true

[ios.info.NSAppTransportSecurity]
# Listen streams takes from a take server on the laptop over plain http
# (a Tailscale 100.x address); ATS exceptions cannot name an IP address.
NSAllowsArbitraryLoads = true
