[[gap]]
id = "read-only-queries"
reference = "Searches every article as you type"
ixos_today = "forge-app's commands are serial and every successful one raises the revision and announces a change; the database belongs to the command thread"
workaround = "Commonplace opens its own read-only SQLite connection (WAL) for search and runs it with Runtime::run, so a search never waits for a command and never counts as a change (store.rs `Searcher`)"
missing = "A way to run a read against the store that doesn't raise the revision (friction A5), or a read connection Database hands out"
layer = "rust"
cost = "small"
blocks = false
second_use = "Chat's search runs as a query on its own store; the same need"

