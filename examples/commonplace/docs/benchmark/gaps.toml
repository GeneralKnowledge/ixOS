[[gap]]
id = "concurrent-fetches"
reference = "Refreshes many feeds at once"
ixos_today = "Runtime::run gives one cancellable unit of work on its own thread"
workaround = "Feeds are fetched one after another inside one run; fine for a dozen fixture feeds, slow for hundreds. Not a lasting assumption: each fetch is independent and the results are applied together in one command, so a fan-out replaces only the loop in AppCore::refresh. Not to be built in B0"
missing = "A bounded fan-out for cancellable work (N requests at a time, all stopped together)"
layer = "rust"
cost = "medium"
blocks = false
second_use = "none yet"

