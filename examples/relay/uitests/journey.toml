# Relay's Chats on a real iPhone: create an account on the project's chat server,
# open General, send a message, start a conversation, then sign out.
# Runs on throwaway data (-ForgeUITestData): the account lives only in
# memory and the chats in a temporary folder, so the person's own account
# and chats are never touched. Needs the phone on the tailnet (Tailscale on)
# for the project's server, examples/relay/messaging/chat-server/deploy.
#
# Relay is tested inside Device Lab, the one app on the test phone:
# `-launchApp relay` sets Device Lab's "Open at Launch" for this launch only.
# For the standalone app, use app = "org.forgemobile.agentlab" and drop those two
# arguments.
#   forge ui run examples/relay/uitests/journey.toml

name = "Chat: sign up, send, new conversation, sign out"
app = "org.forgemobile.devicelab"

[[step]]
terminate = {}

[[step]]
launch = { args = ["-ForgeUITestData", "-launchApp", "relay"] }

[[step]]
screenshot = "1-sign-up"

[[step]]
type = { id = "signUp.name", text = "UI Test" }

# The project's server is the default; this button shows only when the field
# holds another address (from an earlier launch).
[[step]]
tap = { id = "signUp.create" }

[[step]]
expect = { id = "chats.conversation.general" }

[[step]]
screenshot = "2-chats"

[[step]]
tap = { id = "chats.conversation.general" }

[[step]]
type = { id = "chat.composer", text = "Hello from forge ui" }

[[step]]
tap = { id = "chat.send" }

[[step]]
expect = { label_contains = "Hello from forge ui" }

[[step]]
screenshot = "3-sent"

[[step]]
back = {}

[[step]]
tap = { id = "chats.new" }

[[step]]
type = { id = "newConversation.title", text = "UI test room" }

[[step]]
tap = { id = "newConversation.confirm" }

[[step]]
expect = { id = "chat.composer" }

[[step]]
back = {}

[[step]]
tap = { label = "Settings" }

[[step]]
tap = { id = "settings.signOut" }

[[step]]
tap = { id = "settings.confirmSignOut" }

[[step]]
expect = { id = "signUp.name" }

[[step]]
screenshot = "4-signed-out"
