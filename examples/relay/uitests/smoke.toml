# Smoke test: from the empty screen, open Send with a Code, then close it.
# Uses a temporary data folder; asks for the local network but needs no
# second device.
# Run with the phone plugged in:  forge ui run examples/relay/uitests/smoke.toml
name = "Smoke: open Send with a Code"
app = "org.forgemobile.devicelab"

[[step]]
terminate = {}

[[step]]
launch = { args = ["-ForgeTemporaryData", "-launchApp", "relay"] }

[[step]]
screenshot = "1-empty"

[[step]]
tap = { id = "devices.sendFirst" }

[[step]]
expect = { id = "sendCode.status" }

[[step]]
screenshot = "2-send"

[[step]]
tap = { id = "sendCode.close" }

[[step]]
expect = { id = "sendCode.status", gone = true }
