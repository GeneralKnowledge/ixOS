[package]
name = "chat-server"
version = "0.1.0"
description = "Chat server for the Chat example: accounts, rooms and messages on disk, HTTP + Server-Sent Events. Runs on your own computer."
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
axum = "0.8"
futures-util = { version = "0.3", default-features = false }
# Account tokens and ids come from the OS random generator.
getrandom = "0.4"
serde = { workspace = true }
# Attachments are stored under the SHA-256 of their bytes.
sha2 = "0.10"
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
# Rooms on Relay's model (N4): relay/room/1 over iroh, each stream an
# HTTP/1.1 connection to the same API.
iroh = { version = "1", default-features = false, features = ["tls-ring"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
tempfile = "3.14"
# A plain HTTP/1.1 client over relay/room/1 streams (tests/room.rs).
hyper = { version = "1", features = ["client", "http1"] }
http-body-util = "0.1"
chat-core = { workspace = true, features = ["ureq"] }
# HTTPS end-to-end test: a TLS front for the mock server with a throwaway CA.
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
