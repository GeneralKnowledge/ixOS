# Relay's own Rust library: word codes and trusted devices over iroh,
# sending and receiving notes and files, messaging (`src/chat`, Chat's core
# before it merged into Relay), and the UniFFI API (RelayCore, ChatCore) the
# SwiftUI app calls. Also the `relay` command, the second device on a Linux
# machine (built only with `--features cli`). Built the way a hostable app
# is (docs/research/app-friction-log.md).
[package]
name = "relay-core"
version = "0.1.0"
edition = "2021"
# iroh 1.x needs 1.91.
rust-version = "1.91"
publish = false

[lib]
name = "relay_core"
crate-type = ["staticlib", "lib"]

[[bin]]
name = "relay"
path = "src/bin/relay.rs"
required-features = ["cli"]

[[bin]]
name = "relay-mailbox"
path = "src/bin/relay-mailbox.rs"
required-features = ["server"]

[features]
# The `relay` command for Linux and macOS. Never built for iOS.
cli = ["dep:qrcode", "dep:mdns-sd"]
# The `relay-mailbox` server (N3), run on Relay's own server. Never built
# for iOS.
server = []

[dependencies]
# The application runtime: one core per process, serial commands, revisions,
# lifecycle, cancellation, shutdown (docs/app-model-review.md).
forge-app = { path = "../../../crates/forge-app" }
forge-runtime = { path = "../../../crates/forge-runtime" }
# Random bytes for the device key, ids and word codes.
getrandom = "0.3"
# Relay's record (devices, history) is one JSON document; received files are
# kept only if their SHA-256 matches what the sender announced.
# Messaging's assistant keeps its conversations in SQLite (assistant.db).
forge-storage = { path = "../../../crates/forge-storage", features = ["hash", "sqlite"] }
# Must match the uniffi-bindgen Forge generates bindings with.
uniffi = "=0.32.2"
# Forge AI: the request shape a device asks another device's language model
# with, and the model interface the asked device answers through.
# Messaging keeps its account in the Keychain and makes its requests (the
# live stream too) through URLSession.
forge-services = { path = "../../../crates/forge-services", features = ["ai", "http"] }
# Messaging's chat server client, and the `relay serve-ai` command's
# requests to an OpenAI-compatible server.
forge-net = { path = "../../../crates/forge-net", features = ["ureq"] }
# Messaging's engine (../messaging/chat-core): conversations, the outbox,
# the store, the live stream from a chat server.
chat-core = { path = "../messaging/chat-core", features = ["ureq"] }
# UniFFI's generated code for async host interfaces names it directly.
async-trait = "0.1"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
# relay/device/1 messages (src/device.rs).
ciborium = "0.2"
# Blob bytes in a mailbox item as CBOR byte strings, not arrays of numbers.
serde_bytes = "0.11"
thiserror = "2.0"
# Receiving with a word code (src/code.rs, Relay M1): iroh with relays off,
# iroh-blobs for verified, resumable files, SPAKE2 for the code. The same
# versions as the M0 spike (examples/relay/spike), whose sender it talks to.
iroh = { version = "1", default-features = false, features = ["tls-ring"] }
iroh-blobs = "=0.104.1"
# Relay's own servers (M2 PR 7): a relay and a lookup server, by URL.
url = "2.5"
blake3 = "1"
# Streams of download progress (iroh-blobs' own async helpers).
n0-future = "0.3"
# Held at 0.2.189: libc 0.2.190 made the routing and IPv6 interface types
# that iroh's netwatch and netdev use on iOS macOS-only, so newer libc does
# not build for the iPhone. iroh-blobs 0.105 and mio 1.2.5 require 0.2.190,
# hence 0.104.1 above (same protocol; tested against the spike's 0.105
# sender). Lift both when netwatch and netdev ship their iOS fixes
# (n0-computer/net-tools#267, shellrow/netdev#195).
libc = "=0.2.189"
spake2 = "0.4"
sha2 = "0.10"
# Deriving the mailbox key and deposit passes from the device key (N3).
hkdf = "0.12"
hmac = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "fs", "io-util"] }
log = "0.4"
# The `relay` command prints a word code's QR code in the terminal.
qrcode = { version = "0.14", default-features = false, optional = true }
# The `relay` command advertises and finds word codes with mDNS, as the app
# does with Bonjour (`_forgerelay._udp`). The same crate as the M0 spike.
mdns-sd = { version = "0.13", optional = true }
# Sites over Relay (N6, src/web.rs): reads HTTP/1.1 request and response
# heads. Already in the tree through iroh.
httparse = "1.10"
hpke = { version = "0.15.1", default-features = false, features = ["alloc", "x25519", "chacha", "getrandom"] }

[dev-dependencies]
tempfile = "3.14"
# Messaging's tests run the real chat server in process.
chat-server = { path = "../messaging/chat-server" }
axum = "0.8"
tokio = { version = "1", features = ["net", "test-util"] }
# A pkarr lookup server in process (tests/servers.rs).
iroh = { version = "1", default-features = false, features = ["tls-ring", "test-utils"] }
# A plain-HTTP relay server in process, as on Hetzner (tests/servers.rs).
iroh-relay = { version = "1", default-features = false, features = ["server"] }

# Its own workspace, like every app made with `forge init`.
[workspace]

[profile.release]
lto = true
codegen-units = 1
