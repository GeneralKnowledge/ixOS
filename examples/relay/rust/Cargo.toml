# Relay's own Rust library: pairing by QR code, the encrypted peer protocol,
# sending and receiving notes and files, and the UniFFI API (RelayCore) the
# SwiftUI app calls. Also the `relay` command, the second device on a Linux
# machine (built only with `--features cli`). Built the way a hostable app
# is (docs/research/app-friction-log.md).
[package]
name = "relay-core"
version = "0.1.0"
edition = "2021"
# iroh 1.x needs 1.91.
rust-version = "1.91"
publish = false

[lib]
name = "relay_core"
crate-type = ["staticlib", "lib"]

[[bin]]
name = "relay"
path = "src/bin/relay.rs"
required-features = ["cli"]

[features]
# The `relay` command for Linux and macOS. Never built for iOS.
cli = ["dep:qrcode", "dep:forge-net", "dep:mdns-sd"]

[dependencies]
# The application runtime: one core per process, serial commands, revisions,
# lifecycle, cancellation, shutdown (docs/app-model-review.md).
forge-app = { path = "../../../crates/forge-app" }
forge-runtime = { path = "../../../crates/forge-runtime" }
# The device tools' wire layer, reused as it is: length-prefixed frames, a
# Noise XXpsk3 handshake keyed by a shared secret, CBOR messages, over any
# blocking stream (friction R1: it lives in a tooling crate).
forge-devproto = { path = "../../../crates/forge-devproto" }
# Relay's record (peers, history) is one JSON document; received files are
# kept only if their SHA-256 matches what the sender announced.
forge-storage = { path = "../../../crates/forge-storage", features = ["hash"] }
# Must match the uniffi-bindgen Forge generates bindings with.
uniffi = "=0.32.2"
# Forge AI: the request shape a device asks another device's language model
# with, and the model interface the asked device answers through.
forge-services = { path = "../../../crates/forge-services", features = ["ai"] }
# The `relay serve-ai` command reaches an OpenAI-compatible server over HTTP.
forge-net = { path = "../../../crates/forge-net", features = ["ureq"], optional = true }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
# Receiving with a word code (src/code.rs, Relay M1): iroh with relays off,
# iroh-blobs for verified, resumable files, SPAKE2 for the code. The same
# versions as the M0 spike (examples/relay/spike), whose sender it talks to.
iroh = { version = "1", default-features = false, features = ["tls-ring"] }
iroh-blobs = "=0.104.1"
# Streams of download progress (iroh-blobs' own async helpers).
n0-future = "0.3"
# Held at 0.2.189: libc 0.2.190 made the routing and IPv6 interface types
# that iroh's netwatch and netdev use on iOS macOS-only, so newer libc does
# not build for the iPhone. iroh-blobs 0.105 and mio 1.2.5 require 0.2.190,
# hence 0.104.1 above (same protocol; tested against the spike's 0.105
# sender). Lift both when netwatch and netdev ship their iOS fixes
# (n0-computer/net-tools#267, shellrow/netdev#195).
libc = "=0.2.189"
spake2 = "0.4"
sha2 = "0.10"
hmac = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
log = "0.4"
# The `relay` command prints its pairing code as a QR code in the terminal.
qrcode = { version = "0.14", default-features = false, optional = true }
# The `relay` command advertises and finds word codes with mDNS, as the app
# does with Bonjour (`_forgerelay._udp`). The same crate as the M0 spike.
mdns-sd = { version = "0.13", optional = true }

[dev-dependencies]
tempfile = "3.14"
forge-net = { path = "../../../crates/forge-net", features = ["ureq"] }
serde_json = "1.0"

# Its own workspace, like every app made with `forge init`.
[workspace]

[profile.release]
lto = true
codegen-units = 1
