[package]
name = "chat-core"
version = "0.1.0"
description = "Domain core of the Chat example: conversations, messages, SSE event pump, JSON store"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
# Real HTTP(S) transport for `HttpRepo::with_ureq` (forge-net's UreqClient).
ureq = ["forge-net/ureq"]

[dependencies]
forge-net = { workspace = true }
forge-storage = { workspace = true, features = ["sqlite"] }
serde = { workspace = true }
# Attachments are named by the SHA-256 of their bytes, as on the server.
sha2 = "0.10"
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3.14"
