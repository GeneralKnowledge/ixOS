[app]
name = "Checklist"
bundle_id = "org.forgemobile.agentlab"
minimum_ios = "17.0"

[rust]
path = "rust"

[build]
ios_device = true
ios_simulator = false

# Built on the application runtime (docs/app-model-review.md): forge-app in
# rust/Cargo.toml and ForgeKit in Package.swift, from this checkout. (A `[forge]
# version` key that tools check comes with phase 3.)

[ui_test]
# Fresh throwaway data instead of the person's checklist.
test_data_args = ["-ForgeTemporaryData"]

[ios]
xtool_product = "ChecklistXtool"

[ios.signing]
# Built and installed with a free Apple account; no paid-only entitlements.
team_type = "free"

# Swift module names: this app's own, so another app (Device Lab) can host it.
[swift]
bindings_module = "ChecklistFFI"
app_module = "ChecklistApp"
