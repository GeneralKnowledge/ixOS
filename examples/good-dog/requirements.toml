# What Good Dog GD1 must do, and what proves it (docs/evidence.md).
# `twin`: XCTests that drive the real view model against the real Rust core
# (`forge check swift` runs them on Linux). `device`: UI scenarios for
# `forge ui run`; their verdicts come only from a run on an iPhone.

[[requirement]]
id = "GD-1"
statement = "A new owner describes their dog and gets a short starter plan for today."
twin = ["GoodDogModelTests.testOnboardingLeadsToATodayPlanThatSurvivesARelaunch"]
device = ["uitests/journey.toml"]

[[requirement]]
id = "GD-2"
statement = "Today's plan stays the same all day, survives a relaunch, and changes on a new day."
twin = ["GoodDogModelTests.testOnboardingLeadsToATodayPlanThatSurvivesARelaunch", "GoodDogModelTests.testANewDayBringsANewPlan"]

[[requirement]]
id = "GD-3"
statement = "Recording how a session went marks it done, moves the skill on and appears in history."
twin = ["GoodDogModelTests.testRecordingASessionUpdatesTodayProgressAndHistory"]
device = ["uitests/journey.toml"]

[[requirement]]
id = "GD-4"
statement = "An invalid dog name is refused with a plain message and changes nothing."
twin = ["GoodDogModelTests.testInvalidNamesAreRefusedAndChangeNothing"]

[[requirement]]
id = "GD-5"
statement = "The owner can swap an activity, take a short plan, and erase everything."
twin = ["GoodDogModelTests.testSwapShortenAndErase"]

[[requirement]]
id = "GD-6"
statement = "Learn shows exercises by topic, a glossary and search across both, from Rust's content."
twin = ["GoodDogModelTests.testLearnSearchAndGlossaryComeFromRust"]
device = ["uitests/journey.toml"]

[[requirement]]
id = "GD-7"
statement = "An exercise can be followed as a guided session, one card at a time (get ready, then each step with its number), and recording its outcome at the end records it exactly as the exercise screen does; leaving part way records nothing."
twin = ["GoodDogModelTests.testAGuidedSessionStepsThroughAndRecordsLikeTheExerciseScreen", "GoodDogModelTests.testLeavingAGuidedSessionPartWayRecordsNothing"]
device = ["uitests/guided.toml"]

[[requirement]]
id = "GD-8"
statement = "Goals: onboarding's answer starts a matching goal, Today leads with its stage and an everyday idea, the goal shows as a path of stages, and the owner's yes to a stage's question moves it on with a celebration; pause, resume, add and set aside keep progress."
twin = ["GoodDogModelTests.testOnboardingStartsTheChosenGoalAndTodayLeadsWithIt", "GoodDogModelTests.testPassingAStageCelebratesAndPauseKeepsTheGoal"]
device = ["uitests/goals.toml"]

[[requirement]]
id = "GD-9"
statement = "Not Today makes a rest day that can be taken back, and the week counts practice days against a gentle target, so a rest day never breaks a run."
twin = ["GoodDogModelTests.testNotTodayIsARestDayAndTheWeekCountsDaysNotStreaks"]
device = ["uitests/goals.toml"]

[[requirement]]
id = "GD-10"
statement = "Each goal stage has a short lesson plan (learn, practise, everyday, quick check) that unlocks one lesson at a time; recording a session finishes a practise lesson, and a quick check explains its answer whether right or wrong."
twin = ["GoodDogModelTests.testLessonsUnlockOneByOneAndAQuickCheckExplainsEitherWay"]
device = ["uitests/lessons.toml"]
