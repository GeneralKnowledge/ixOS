# Sketchbook's own Rust library: sketches, their layers and the undo history,
# and the UniFFI API (SketchbookCore) the SwiftUI app calls. PencilKit draws
# and renders; this crate decides what a sketch is and what undo does.
# Built the way a hostable app is (docs/research/app-friction-log.md): the
# library is named after the app and `setup_scaffolding!()` takes no
# argument, so the showcase can link it next to other apps.
[package]
name = "sketchbook-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[lib]
name = "sketchbook_core"
crate-type = ["staticlib", "lib"]

[dependencies]
# The application runtime: one core per process, serial commands, revisions,
# lifecycle, cancellation, shutdown (docs/app-model-review.md).
forge-app = { path = "../../../crates/forge-app" }
forge-runtime = { path = "../../../crates/forge-runtime" }
# The sketch list is one JSON document; drawings are files named by their
# SHA-256, so an undo step that keeps a drawing costs a name, not a copy.
forge-storage = { path = "../../../crates/forge-storage", features = ["hash"] }
# Must match the uniffi-bindgen Forge generates bindings with.
uniffi = "=0.32.2"
serde = { version = "1.0", features = ["derive"] }
# forge-storage hashes files it imports, not bytes in memory (friction S1).
sha2 = "0.10"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.14"

# Its own workspace, like every app made with `forge init`.
[workspace]

[profile.release]
lto = true
codegen-units = 1
