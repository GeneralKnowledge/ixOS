# What Sketchbook must do, and what proves it (docs/evidence.md).
# `twin`: XCTests that drive the real view model against the real Rust core
# (`forge check swift` runs them on Linux). `device`: UI scenarios for
# `forge ui run`; their verdicts come only from a run on an iPhone.
# The Rust rules beneath (history after a restart, unused drawings removed,
# failed changes leave everything as it was, export plans, unreadable files)
# are tested in rust/tests/core.rs.

[[requirement]]
id = "SK-1"
statement = "A new sketch starts with one layer; a stroke is kept as that layer's drawing; adding a layer is a step that Undo takes back, with Redo then offered; and the last layer can't be deleted, which an alert explains."
twin = ["SketchbookModelTests.testDrawAddLayerAndUndo"]
device = ["uitests/smoke.toml"]
