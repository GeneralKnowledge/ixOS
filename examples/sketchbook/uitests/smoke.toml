# SK-1 on a real iPhone, in Device Lab (the app on the phone): make a
# sketch, open its layers, add one, undo it. Uses a temporary data folder,
# so it leaves no sketches behind.
#   forge ui run examples/sketchbook/uitests/smoke.toml
name = "SK-1: new sketch, add a layer, undo"
app = "org.forgemobile.devicelab"

[[step]]
terminate = {}

[[step]]
launch = { args = ["-ForgeTemporaryData", "-launchApp", "sketchbook"] }

[[step]]
screenshot = "1-empty"

[[step]]
tap = { id = "sketches.newFirst" }

[[step]]
expect = { id = "sketch.canvas" }

[[step]]
expect = { id = "sketch.undo", enabled = false }

[[step]]
tap = { id = "sketch.layers" }

[[step]]
tap = { id = "layers.add" }

[[step]]
screenshot = "2-two-layers"

[[step]]
tap = { id = "layers.done" }

[[step]]
expect = { id = "sketch.undo", enabled = true }

[[step]]
tap = { id = "sketch.undo" }

[[step]]
expect = { id = "sketch.undo", enabled = false }

[[step]]
screenshot = "3-undone"
