[app]
name = "Chat"
bundle_id = "org.forgemobile.chat"
minimum_ios = "17.0"

[rust]
# This app's own Rust crate: account, chat engine (chat-core), lifecycle.
path = "rust"

[build]
ios_device = true
ios_simulator = false

# iOS settings; Forge writes Info.plist, App.entitlements and xtool.yml from
# them (docs/app-config.md).
[ios]
xtool_product = "ChatXtool"
# Message notifications open forgechat://conversation/<id> (LocalChatNotifier).
url_schemes = ["forgechat"]

[ios.permissions]
# The demo server runs on your computer, reached over the LAN.
local_network = "Chat connects to the demo chat server on your local network."
# Voice messages (M4). Declaring it also brings Forge's Swift audio module.
microphone = "Chat records a voice message while you tap the microphone button."
# The optional app lock in Settings (native_services!(biometrics)).
face_id = "Chat uses Face ID to unlock when you turn on the app lock in Settings."

# Swift module names: this app's own, so another app (Device Lab) can host it.
[swift]
bindings_module = "ChatFFI"
app_module = "ChatApp"
