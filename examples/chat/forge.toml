[app]
name = "Chat"
bundle_id = "org.forgemobile.chat"
minimum_ios = "17.0"

[rust]
# This app's own Rust crate: account, chat engine (chat-core), lifecycle.
path = "rust"

[build]
ios_device = true
ios_simulator = false

# iOS settings; Forge writes Info.plist, App.entitlements and xtool.yml from
# them (docs/app-config.md).
[ios]
xtool_product = "ChatXtool"
# Message notifications open forgechat://conversation/<id> (LocalChatNotifier).
url_schemes = ["forgechat"]

[ios.permissions]
# The demo server runs on your computer, reached over the LAN.
local_network = "Chat connects to the demo chat server on your local network."
