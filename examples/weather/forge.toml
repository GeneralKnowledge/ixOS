[app]
name = "Weather"
bundle_id = "org.forgemobile.weather"
minimum_ios = "17.0"

[rust]
path = "rust"

[build]
ios_device = true
ios_simulator = false

# iOS settings; Forge writes Info.plist, App.entitlements and xtool.yml from
# them (docs/app-config.md).
[ios]
xtool_product = "WeatherXtool"

[ios.permissions]
location_when_in_use = "Weather uses your location to show the forecast where you are."
