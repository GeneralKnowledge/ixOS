# The Weather example's own Rust library: Open-Meteo search and forecasts over forge-net, an offline cache, and the UniFFI API (ForgeWeatherApp) the SwiftUI host calls.
[package]
name = "weather-app"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# The app's own library name, so another app can link this crate (the Device
# Lab showcase does). Forge still stages it as libforge_ffi.a and generates
# its Swift as the ForgeFFI module, so the Swift package is unchanged. No
# cdylib: as another app's dependency Cargo would link it for iOS, which needs
# Apple's linker; `forge bindings generate` builds the host one it needs.
name = "weather_core"
crate-type = ["staticlib", "lib"]

[dependencies]
forge-net = { path = "../../../crates/forge-net", features = ["ureq"] }
forge-storage = { path = "../../../crates/forge-storage" }
# The async bridge and the Android JNI init (ForgeAndroid.nativeInit).
forge-runtime = { path = "../../../crates/forge-runtime" }
# Must match the uniffi-bindgen Forge generates bindings with.
uniffi = "=0.32.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.14"

# Its own workspace, like every app made with `forge init`.
[workspace]

[profile.release]
# Smaller app binaries; Rust panics still reach the host as errors via UniFFI.
lto = true
codegen-units = 1
