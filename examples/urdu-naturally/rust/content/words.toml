# Urdu, Naturally: the Building Blocks. The foundation vocabulary that lets
# you build your own sentences instead of only repeating memorised ones.
#
# Same fields as phrases.toml (read its header), with these defaults:
# difficulty 1, formality neutral, speaker any, status draft. And:
#   also_in   other topics the word belongs to (yaar is glue and a reaction)
#   opposite  the id of its positive (or negative) twin, taught together
#   combos    its common spoken combinations: learn "main bhi", not "bhi"
#   cloze     a line with ___ where the word goes, for the third way of
#             practising: not "what does it mean" or "how do you say it",
#             but "use it here"
#   variants  as in phrases.toml; kind = feminine | plural for the forms of
#             a describing word (acha, achi, ache)
#
# Nothing here has been checked by a native speaker yet (status = draft).

[[topic]]
id = "questions"
title = "Question words"
description = "What, why, who, where, when, how: ask and understand questions."
level = "foundation"

[[topic]]
id = "people"
title = "Me, you and everyone"
description = "Main, tum, aap, mujhe: talking about yourself and other people."
level = "foundation"

[[topic]]
id = "negatives"
title = "Negatives and responses"
description = "No, not, don't, never: refuse, disagree and say what didn't happen. Each next to its positive."
level = "foundation"

[[topic]]
id = "connectors"
title = "Connectors"
description = "And, but, because, if, also: join thoughts into sentences."
level = "foundation"

[[topic]]
id = "time"
title = "Time"
description = "Now, today, kal (yesterday and tomorrow), always, sometimes."
level = "foundation"

[[topic]]
id = "place"
title = "Here and there"
description = "Here, there, inside, near, together: where things are."
level = "foundation"

[[topic]]
id = "describing"
title = "Describing things"
description = "Good, bad, big, new, easy, tasty: and how they change for feminine and plural."
level = "foundation"

[[topic]]
id = "verbs"
title = "Everyday verbs"
description = "Do, go, come, eat, want, understand: each with the forms you'll actually use."
level = "foundation"

[[topic]]
id = "reactions"
title = "Reactions"
description = "Haan, jee, bilkul, waah, ruko: answering friends naturally."
level = "foundation"

# ------------------------------------------------------------- questions

[[word]]
id = "kya"
roman = "Kya"
english = "What? / (turns a sentence into a question)"
urdu = "کیا"
topic = "questions"
usage = "At the start of a sentence it just makes it a question: Kya tum aa rahe ho? Are you coming?"
combos = [
  { roman = "Yeh kya hai?", english = "What is this?" },
  { roman = "Kya hua?", english = "What happened?" },
]
cloze = { prompt = "Yeh ___ hai?", english = "What is this?" }

