# Urdu, Naturally: the people you talk to, and the conversations. The
# conversations ARE the course: every word you learn comes from one.
#
# A scenario's turns name phrases from phrases.toml, so the same phrase met
# in two conversations is one phrase with one progress record. "them" is the
# scenario's character; "you" is a line you say out loud.
#
# A character's circle (friends, family) is who they talk like: in free chat
# they answer with lines from their own conversations first, then from
# conversations with someone in the same circle, never anyone else's.

[[character]]
id = "ali"
name = "Ali"
gender = "male"
description = "Your friend. Relaxed, funny, says yaar a lot."
speech_rate = 1.0
circle = "friends"

