# Urdu, Naturally: the people you talk to, and the conversations of 0.1.
#
# A scenario's turns name phrases from phrases.toml, so the same phrase met
# in two conversations is one phrase with one progress record. "them" is the
# scenario's character; "you" is a line you say out loud.

[[character]]
id = "ali"
name = "Ali"
gender = "male"
description = "Your friend. Relaxed, funny, says yaar a lot."
speech_rate = 1.0

[[character]]
id = "ayesha"
name = "Ayesha"
gender = "female"
description = "Warm and patient, and good at explaining what she means."
speech_rate = 0.9

[[character]]
id = "omar"
name = "Omar"
gender = "male"
description = "Talks fast, full of slang, always making plans."
