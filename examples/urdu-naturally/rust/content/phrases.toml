# Urdu, Naturally: the phrase library. This file is the curriculum's source
# of truth (docs/content-guidelines.md). The app shows Roman Urdu; the Urdu
# script is kept only so the phone's Urdu voice can read the phrase aloud.
#
# A phrase:
#   id          stable slug; progress is saved against it, so never rename one
#   roman       Roman Urdu, in the house style (content-guidelines.md)
#   english     what it means, in the English you'd actually say
#   urdu        the same words in Urdu script, for speech only
#   topic       one of the [[topic]] ids below
#   difficulty  1 (first week) to 5
#   formality   informal | neutral | polite | formal | context_dependent
#   speaker     "any", or "male" when the phrase is the learner's own male
#               form (give the female form as a variant, so it is understood)
#   literal     word for word, when that helps (optional)
#   usage       when and how to use it (optional)
#   status      draft (not yet checked; everything starts here) | reviewed
#               (grammar, usage and naturalness checked by a competent
#               Pakistani Urdu speaker) | field_tested (confirmed natural in
#               a real conversation of this kind)
#   [[phrase.variant]]  other ways to say it: kind = female_speaker |
#               female_addressee | polite | informal | alternative | spelling
#   [[phrase.part]]     the building blocks, in order
#
# {name} in roman, english or urdu is replaced by the learner's name.

[[topic]]
id = "greetings"
title = "Hello and goodbye"
description = "Starting and ending a conversation."
level = "conversation"

[[topic]]
id = "small-talk"
title = "Keeping it going"
description = "How you are, what you're up to, and reacting to the answer."

[[topic]]
id = "plans"
title = "Making plans"
description = "Tonight, what time, and don't be late."

[[topic]]
id = "banter"
title = "Jokes and banter"
description = "Teasing, being teased, and 'just joking'."

[[topic]]
id = "recovery"
title = "When you're lost"
description = "Slowing people down, asking again, and keeping going anyway."

[[topic]]
id = "glue"
title = "Conversation glue"
description = "Yaar, acha, matlab, pata nahi: the little words that keep a conversation alive."

[[topic]]
id = "your-day"
title = "Your day"
description = "How was it, where are you, on my way: the everyday check-ins."

[[topic]]
id = "family"
title = "Family"
description = "Asking after everyone at home, aunts, Eid, and being fed."

[[topic]]
id = "food"
title = "Food and chai"
description = "Have you eaten, will you have tea, go on have one."

[[topic]]
id = "feelings"
title = "How you feel"
description = "Tired, stressed, fine really: and being told not to worry."

