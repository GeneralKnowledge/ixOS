# Urdu, Naturally: open the first conversation, take your first turn, and
# find it counted after a relaunch. Found by accessibility identifier.
# Runs in Device Lab (the app on the phone) on throwaway data, kept for the
# relaunch, so your own progress is never used.
#   forge ui run examples/urdu-naturally/uitests/smoke.toml
# Format: docs/forge-ui-testing.md.

name = "Smoke: first turn of the first conversation, still counted after a relaunch"
app = "org.forgemobile.devicelab"

[[step]]
terminate = {}

[[step]]
launch = { args = ["-ForgeTemporaryData", "-launchApp", "urdu"] }

[[step]]
tap = { id = "home.next" }

[[step]]
tap = { id = "conversation.reveal" }

[[step]]
tap = { id = "outcome.independent" }

[[step]]
screenshot = "1-first-turn"

[[step]]
terminate = {}

[[step]]
launch = { args = ["-ForgeTemporaryData", "-ForgeKeepTestData", "-launchApp", "urdu"] }

[[step]]
expect = { id = "home.scenario.meeting-someone-new" }
