[app]
name = "PocketLibrary"
bundle_id = "org.forgemobile.pocketlibrary"
minimum_ios = "17.0"
display_name = "Pocket Library"     # home-screen name
version = "1.0.0"                   # CFBundleShortVersionString
build_number = "1"                  # CFBundleVersion; raise it for every upload

[rust]
# This app's own Rust crate: logic, state, persistence, networking.
path = "rust"

[build]
ios_device = true
ios_simulator = false

# iOS settings. Forge writes Info.plist, App.entitlements and xtool.yml from
# this section on every `forge build ios` / `forge run ios` (or `forge config
# sync`), so edit them here, not in those files. All keys: docs/app-config.md.
[ios]
xtool_product = "PocketLibraryXtool"
orientations = ["portrait"]
# Read-aloud keeps speaking when the screen locks or the app is in the background.
background_modes = ["audio"]

# UI automation. This launch argument starts the app on an empty, throwaway
# library (Application Support/PocketLibrary-UITest), so `forge ui explore`
# never changes the person's own books. docs/forge-explore.md
[ui_test]
test_data_args = ["-ForgeUITestData"]

# Swift module names: this app's own, so another app (Device Lab) can host it.
[swift]
bindings_module = "PocketLibraryFFI"
app_module = "PocketLibraryApp"
