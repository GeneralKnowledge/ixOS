[app]
name = "PocketLibrary"
# Home-screen name (read by forge.toml app config from PR #31; Info.plist matches it).
display_name = "Pocket Library"
bundle_id = "org.forgemobile.pocketlibrary"
minimum_ios = "17.0"

[rust]
# This app's own Rust crate: logic, state, persistence, networking.
path = "rust"

[build]
ios_device = true
ios_simulator = false
