# This app's Rust library: its logic, state, persistence and networking, and the
# UniFFI API the SwiftUI and Compose hosts call. Edit freely; `forge build`
# rebuilds it and regenerates the bindings.
[package]
name = "pocket-library-core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# The app's own library name, so another app can link this crate (the Device
# Lab showcase does). Forge still stages it as libforge_ffi.a and generates
# its Swift as the ForgeFFI module, so the Swift package is unchanged. No
# cdylib: as another app's dependency Cargo would link it for iOS, which needs
# Apple's linker; `forge bindings generate` builds the host one it needs.
name = "pocket_library_core"
crate-type = ["staticlib", "lib"]

[dependencies]
# Forge's runtime crates, from the Forge checkout this app was created with.
# The application runtime's foundations: field-by-field validation
# (`forge_app::Validator`, `FieldError`, whose Swift is ForgeKit's ForgeApp
# module) and the library document's save and recovery rules.
forge-app = { path = "../../../crates/forge-app" }
forge-runtime = { path = "../../../crates/forge-runtime" }
forge-storage = { path = "../../../crates/forge-storage", features = ["csv", "backup"] }
forge-net = { path = "../../../crates/forge-net", features = ["ureq"] }
# Must match the uniffi-bindgen Forge generates bindings with.
uniffi = "=0.32.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
# EPUB import: an EPUB is a zip of XHTML with an XML package file. Pure Rust,
# so the crate cross-compiles for iOS without a C toolchain.
zip = { version = "9.4", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
quick-xml = "0.42"

[dev-dependencies]
tempfile = "3.14"

# Its own workspace: the app builds the same inside or outside the Forge checkout.
[workspace]

[profile.release]
# Smaller app binaries; Rust panics still reach the host as errors via UniFFI.
lto = true
codegen-units = 1
