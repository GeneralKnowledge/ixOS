name: Screenshots

# Simulator screenshots of the starter app, Pocket Library and Weather. A review
# aid, not part of the supported workflow (xtool on Linux, then an iPhone):
# the iOS Simulator is not a supported target. On demand only, so it never
# holds a macOS runner a pull request is waiting for: Actions tab ->
# Screenshots -> Run workflow, pick the branch and the app. The screenshots
# are uploaded as an artifact and printed as small JPEGs in the log.
on:
  workflow_dispatch:
    inputs:
      app:
        description: Which app to render
        type: choice
        default: starter
        options: [starter, pocket-library, weather]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.app }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: ${{ inputs.app }} screenshots (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain and simulator target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build for the simulator
        env:
          # The Xcode build phase builds the app's Rust crate for this target.
          FORGE_IOS_TARGET: aarch64-apple-ios-sim
          APP_NAME: ${{ inputs.app }}
        run: |
          case "$APP_NAME" in
            starter)
              DIR="$RUNNER_TEMP/Starter"
              cargo run -q -p forge-cli -- init Starter --platform ios --bundle-id org.example.starter --path "$DIR"
              PROJECT="$DIR/Xcode/Starter.xcodeproj" ;;
            pocket-library) PROJECT=examples/pocket-library/Xcode/PocketLibrary.xcodeproj ;;
            weather) PROJECT=examples/weather/Xcode/Weather.xcodeproj ;;
          esac
          # The projects target devices only (the supported path); allow the
          # simulator in this throwaway copy so xcodebuild offers it.
          sed -i '' 's/SUPPORTED_PLATFORMS = iphoneos;/SUPPORTED_PLATFORMS = "iphoneos iphonesimulator";/' \
            "$PROJECT/project.pbxproj"
          xcodebuild build \
            -project "$PROJECT" \
            -scheme App \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO
      - name: Screenshots
        env:
          APP_NAME: ${{ inputs.app }}
        run: |
          APP="$(find "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator" -maxdepth 1 -name '*.app' | head -1)"
          case "$APP_NAME" in
            starter) ./scripts/ios-screenshots.sh "$APP" org.example.starter Starter "$RUNNER_TEMP/screenshots" ;;
            pocket-library) ./scripts/pocket-library-screenshots.sh "$APP" "$RUNNER_TEMP/screenshots" ;;
            weather) ./scripts/weather-screenshots.sh "$APP" "$RUNNER_TEMP/screenshots" ;;
          esac
      # Reviewers who cannot download artifacts (for example from a sandbox
      # that blocks the artifact store) can decode these from the job log.
      - name: Small copies in the log
        run: |
          mkdir -p "$RUNNER_TEMP/small"
          for f in "$RUNNER_TEMP"/screenshots/*.png; do
            name="$(basename "$f" .png)"
            sips -Z 900 -s format jpeg -s formatOptions 70 "$f" --out "$RUNNER_TEMP/small/$name.jpg" >/dev/null
            echo "SCREENSHOT $name $(base64 -i "$RUNNER_TEMP/small/$name.jpg" | tr -d '\n')"
          done
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.app }}-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: warn
