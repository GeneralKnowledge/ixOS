name: macOS

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-host-tests:
    name: Swift host tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Counter example (XCTest)
        run: ./scripts/test-swift-host.sh examples/counter
      - name: Weather example (XCTest)
        run: ./scripts/test-swift-host.sh examples/weather
      - name: Chat example (XCTest, against the mock chat server)
        run: ./scripts/test-swift-host.sh examples/chat
      # A new app outside the checkout, with its own Rust crate: `forge test`
      # runs its Rust tests, regenerates its bindings and runs its XCTest suite.
      - name: App generated outside the checkout (forge init --path, forge test)
        run: |
          APP="$RUNNER_TEMP/CiTemplateApp"
          cargo run -q -p forge-cli -- init CiTemplateApp --platform ios --bundle-id org.example.citemplate --path "$APP"
          cargo run -q -p forge-cli -- test --project "$APP"

  xcode-build:
    name: Xcode iOS build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain and iOS target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-ios
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The shared "App" scheme builds the app target (the Swift package has an
      # executable product with the app's name, so a scheme named after it is ambiguous).
      - name: Build Counter.xcodeproj (device, unsigned)
        run: |
          xcodebuild build \
            -project examples/counter/Xcode/Counter.xcodeproj \
            -scheme App \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
      - name: Build Weather.xcodeproj (device, unsigned)
        run: |
          xcodebuild build \
            -project examples/weather/Xcode/Weather.xcodeproj \
            -scheme App \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
      - name: Build Chat.xcodeproj (device, unsigned)
        run: |
          xcodebuild build \
            -project examples/chat/Xcode/Chat.xcodeproj \
            -scheme App \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
      - name: Build an Xcode project generated outside the checkout
        run: |
          APP="$RUNNER_TEMP/CiXcodeApp"
          cargo run -q -p forge-cli -- init CiXcodeApp --platform ios --bundle-id org.example.cixcode --path "$APP"
          xcodebuild build \
            -project "$APP/Xcode/CiXcodeApp.xcodeproj" \
            -scheme App \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

  starter-screenshots:
    # A review aid, not part of the supported workflow (xtool on Linux, then
    # an iPhone): renders a freshly generated app in the iOS Simulator so its
    # UI can be checked in light and dark mode and at the largest text size.
    name: Starter app screenshots (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain and simulator target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Generate and build the starter for the simulator
        env:
          # The Xcode build phase builds the app's Rust crate for this target.
          # The project only lists iphoneos (device builds are the supported
          # path), so the simulator is enabled on the command line.
          FORGE_IOS_TARGET: aarch64-apple-ios-sim
        run: |
          APP="$RUNNER_TEMP/Starter"
          cargo run -q -p forge-cli -- init Starter --platform ios --bundle-id org.example.starter --path "$APP"
          xcodebuild build \
            -project "$APP/Xcode/Starter.xcodeproj" \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            SUPPORTED_PLATFORMS="iphoneos iphonesimulator" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO
      - name: Screenshots
        run: |
          ./scripts/ios-screenshots.sh \
            "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/Starter.app" \
            org.example.starter Starter "$RUNNER_TEMP/screenshots"
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: starter-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: warn
