name: macOS

# The checks Linux cannot do: Swift host tests (XCTest against each app's
# Rust core) and unsigned iOS device builds with Xcode, in one job. The
# supported stack is Linux + xtool + an iPhone, so this does not gate pull
# requests: it runs weekly, and by hand on any branch (Actions tab -> macOS ->
# Run workflow) when you want a Mac's opinion on a Swift change. Leave "apps"
# empty to check every app, or name some: counter weather chat
# pocket-library device-lab template services-check.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      apps:
        description: Apps to check (space-separated; empty = all)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS (Swift tests, Xcode build)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain and iOS target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-ios
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Check apps
        env:
          APPS: ${{ inputs.apps }}
        run: |
          read -ra list <<< "${APPS:-all}"
          ./scripts/ci-macos.sh "${list[@]}"
