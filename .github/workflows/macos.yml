name: macOS

# The checks Linux cannot do: Swift host tests (XCTest against each app's
# Rust core) and unsigned iOS device builds with Xcode, in one job so a pull
# request takes one macOS runner, not several. macOS runners are few and
# queue for a long time, so this runs only when something Swift or Xcode
# depends on changes, and a pull request checks only the apps its diff
# touches (scripts/ci-macos.sh). Pushes to main, a weekly run and
# "Run workflow" (Actions tab, any branch) check every app.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE*"
      - "examples/*-android/**"
      - "templates/android-app/**"
      - ".github/workflows/android.yml"
      - ".github/workflows/screenshots.yml"
  pull_request:
    paths:
      - "**.swift"
      - "**/Package.swift"
      - "**/Generated/**"
      - "**.xcodeproj/**"
      - "**/forge.toml"
      - "templates/ios-app/**"
      - "templates/app-rust/**"
      - "crates/forge-cli/**"
      - "crates/forge-services/**"
      - "scripts/ci-macos.sh"
      - "scripts/test-swift-host.sh"
      - "scripts/generate-bindings.sh"
      - "scripts/forge-crate.sh"
      - "scripts/build-rust-ios.sh"
      - "scripts/package-ios-library.sh"
      - "scripts/make-services-check-app.sh"
      - ".github/workflows/macos.yml"
      - "!examples/*-android/**"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Pull requests cancel their own superseded runs; every push to main gets its
# own group so each merge commit is checked in full.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ios:
    name: iOS (Swift tests, Xcode build)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain and iOS target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-ios
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Apps this pull request touches
        if: github.event_name == 'pull_request'
        run: ./scripts/ci-macos.sh affected "${{ github.event.pull_request.base.sha }}"
      - name: Every app
        if: github.event_name != 'pull_request'
        run: ./scripts/ci-macos.sh all
