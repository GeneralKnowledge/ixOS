name: macOS

# A fallback, run by hand only. The routine check that our Swift compiles for
# an iPhone is scripts/check-ios-xtool.sh on a Linux machine with xtool and its
# Darwin SDK (docs/ios-build-check.md): minutes, not a ~35 minute macOS queue.
# Use this workflow only when no such machine is available, or to test the
# Xcode projects and the Swift host tests (XCTest on macOS against each app's
# Rust core), which xtool doesn't use. Actions tab -> macOS -> Run workflow;
# leave "apps" empty to check every app, or name some: counter weather chat
# pocket-library good-dog device-lab template services-check.
on:
  workflow_dispatch:
    inputs:
      apps:
        description: Apps to check (space-separated; empty = all)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS (Swift tests, Xcode build)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain and iOS target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-ios
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Check apps
        env:
          APPS: ${{ inputs.apps }}
        run: |
          read -ra list <<< "${APPS:-all}"
          ./scripts/ci-macos.sh "${list[@]}"
