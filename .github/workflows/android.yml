name: Android

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain and Android targets
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-linux-android x86_64-linux-android

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install cargo-ndk
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: cargo-ndk

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            examples/counter-android/**/*.gradle.kts
            examples/counter-android/gradle/wrapper/gradle-wrapper.properties

      - name: Install Android SDK components
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "error: sdkmanager not found under $SDK/cmdline-tools" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "ndk;28.0.13004108" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=$SDK/ndk/28.0.13004108" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK/ndk/28.0.13004108" >> "$GITHUB_ENV"
          echo "NDK_HOME=$SDK/ndk/28.0.13004108" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Package Rust FFI and Kotlin bindings
        run: ./scripts/package-android-library.sh examples/counter-android/Generated

      - name: Build host forge-ffi for JVM unit tests
        run: cargo build -p forge-ffi

      - name: JVM unit tests (view model against the Rust core)
        working-directory: examples/counter-android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Unit tests for an app generated from the Android template
        run: |
          cargo run -q -p forge-cli -- init CiTemplateAndroid --platform android --bundle-id org.example.citemplate
          cd examples/CiTemplateAndroid
          ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Assemble debug APK
        working-directory: examples/counter-android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Verify packaged native libraries
        run: ./scripts/verify-android-packaging.sh examples/counter-android

      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-unit-test-reports
          path: examples/*/app/build/reports/tests/

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: counter-android-debug
          path: examples/counter-android/app/build/outputs/apk/debug/*.apk
