name: Android

# Android is work in progress and iOS is the focus, so pull requests run this
# only when Android code itself changes. Pushes to main also run it when the
# shared Rust it builds on changes, and it can be run by hand (Actions tab ->
# Android -> Run workflow) on any branch.
on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "examples/*-android/**"
      - "examples/counter/rust/**"
      - "examples/chat-core/**"
      - "examples/chat-server/**"
      - "examples/pocket-library/rust/**"
      - "templates/android-app/**"
      - "templates/android-rust/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "examples/*-android/**"
      - "templates/android-app/**"
      - "scripts/*android*"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

# Pull requests cancel their own superseded runs; every push to main gets its
# own group so each merge commit is checked in full.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain and Android targets
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-linux-android x86_64-linux-android

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install cargo-ndk
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2
        with:
          tool: cargo-ndk

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            examples/*-android/**/*.gradle.kts
            examples/*-android/gradle/wrapper/gradle-wrapper.properties

      - name: Install Android SDK components
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "error: sdkmanager not found under $SDK/cmdline-tools" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "ndk;28.0.13004108" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=$SDK/ndk/28.0.13004108" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK/ndk/28.0.13004108" >> "$GITHUB_ENV"
          echo "NDK_HOME=$SDK/ndk/28.0.13004108" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Package the Counter's Rust library and Kotlin bindings
        run: ./scripts/package-android-library.sh examples/counter-android/Generated

      - name: Package the Chat example's Rust library and Kotlin bindings
        run: ./scripts/package-android-library.sh examples/chat-android/Generated

      - name: Build the host libraries and the chat server for JVM unit tests
        run: |
          cargo build --manifest-path examples/counter/rust/Cargo.toml
          cargo build --manifest-path examples/chat-android/rust/Cargo.toml
          cargo build -p chat-server

      - name: JVM unit tests (view model against the Rust core)
        working-directory: examples/counter-android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Chat JVM unit tests (session against the Rust core and the mock server)
        working-directory: examples/chat-android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      # A new app outside the checkout, with its own Rust crate, through the
      # public CLI: JVM unit tests against its Rust core, then a debug APK
      # whose native libraries are built from that crate.
      - name: App generated outside the checkout (forge init --path)
        run: |
          APP="$RUNNER_TEMP/CiTemplateAndroid"
          echo "FRESH_ANDROID_APP=$APP" >> "$GITHUB_ENV"
          cargo run -q -p forge-cli -- init CiTemplateAndroid --platform android --bundle-id org.example.citemplate --path "$APP"
          cargo test --manifest-path "$APP/rust/Cargo.toml"

      - name: Generated app JVM unit tests (view model against its own Rust core)
        run: |
          cargo run -q -p forge-cli -- bindings generate --project "$FRESH_ANDROID_APP"
          cd "$FRESH_ANDROID_APP" && ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Generated app debug APK (forge build android)
        run: |
          cargo run -q -p forge-cli -- build android --project "$FRESH_ANDROID_APP"
          ./scripts/verify-android-packaging.sh "$FRESH_ANDROID_APP"

      - name: Assemble Chat debug APK
        working-directory: examples/chat-android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Verify packaged native libraries
        run: |
          ./scripts/verify-android-packaging.sh examples/chat-android

      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-unit-test-reports
          path: |
            examples/*/app/build/reports/tests/
            ${{ runner.temp }}/CiTemplateAndroid/app/build/reports/tests/

      - name: Upload Chat debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chat-android-debug
          path: examples/chat-android/app/build/outputs/apk/debug/*.apk

  # Android stage 0 (docs/roadmap.md#android--work-in-progress): Pocket
  # Library's own Rust core, unchanged, under a Compose screen on an emulator.
  # Adds, opens and deletes a book by the iOS app's identifiers.
  pocket-library-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain and the emulator's Android target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add x86_64-linux-android

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            examples/pocket-library-android/rust -> target

      - name: Install cargo-ndk
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2
        with:
          tool: cargo-ndk

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            examples/pocket-library-android/**/*.gradle.kts
            examples/pocket-library-android/gradle/wrapper/gradle-wrapper.properties

      - name: Install Android SDK components
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "ndk;28.0.13004108" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=$SDK/ndk/28.0.13004108" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK/ndk/28.0.13004108" >> "$GITHUB_ENV"

      - name: Pocket Library's Rust for the emulator (x86_64) and its Kotlin bindings
        env:
          FORGE_ANDROID_ABIS: x86_64
        run: ./scripts/package-android-library.sh examples/pocket-library-android/Generated

      - name: JVM unit tests (host and model against the Rust core)
        working-directory: examples/pocket-library-android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Compose UI test on an Android 15 emulator
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: examples/pocket-library-android
          # On a failure, the app's log (the Rust core logs through logcat) shows why.
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon || { adb logcat -d -t 400 | grep -iE "pocketlibrary|forge|AndroidRuntime|jna|uniffi|TestRunner" | tail -150; exit 1; }

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pocket-library-android-test-reports
          path: |
            examples/pocket-library-android/app/build/reports/
            examples/pocket-library-android/app/build/outputs/androidTest-results/
