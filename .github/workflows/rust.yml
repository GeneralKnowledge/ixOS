name: Rust

# Docs-only changes skip CI entirely.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE*"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE*"]

permissions:
  contents: read

# Pull requests cancel their own superseded runs; every push to main gets its
# own group so each merge commit is checked in full.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs the toolchain pinned in rust-toolchain.toml.
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      # The app-owned crates (examples/*/rust) have their own target
      # directories; caching them too takes check-app-crates.sh from ~5 min to
      # an incremental build.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            examples/chat/rust -> target
            examples/checklist/rust -> target
            examples/counter/rust -> target
            examples/device-lab/rust -> target
            examples/good-dog/rust -> target
            examples/pocket-library/rust -> target
            examples/weather/rust -> target
          # Six target directories are large: only main saves them, pull
          # requests restore main's.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: native rebuild regression
        run: ./scripts/test-native-rebuild.sh
      # Apps made with forge init (examples/pocket-library) have their own
      # Cargo workspace, so the steps above do not reach them.
      - name: App-owned crates (fmt, clippy, tests, binding drift)
        run: ./scripts/check-app-crates.sh
      - name: ForgeKit's contract bindings and version match forge-app
        run: ./scripts/forgekit.sh check
      - name: Kotlin bindings match committed files
        run: ./scripts/check-bindings.sh
      - name: Templates pin the workspace's UniFFI and verifier versions
        run: ./scripts/check-template-sync.sh
      - name: validate Xcode project layout
        run: |
          ./scripts/validate-xcode-project.sh
          ./scripts/validate-xcode-project.sh examples/weather/Xcode/Weather.xcodeproj/project.pbxproj
          ./scripts/validate-xcode-project.sh examples/chat/Xcode/Chat.xcodeproj/project.pbxproj
          ./scripts/validate-xcode-project.sh examples/pocket-library/Xcode/PocketLibrary.xcodeproj/project.pbxproj
          ./scripts/validate-xcode-project.sh examples/device-lab/Xcode/DeviceLab.xcodeproj/project.pbxproj
          ./scripts/validate-xcode-project.sh examples/good-dog/Xcode/GoodDog.xcodeproj/project.pbxproj
          ./scripts/validate-xcode-project.sh templates/ios-app/Xcode/FORGE_PACKAGE_NAME.xcodeproj/project.pbxproj

  fresh-app:
    name: Fresh app outside the checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # forge init --path for iOS and Android, the app's own crate tested,
      # linted and formatted on its own, and a Rust API change reaching the
      # bindings through `forge bindings generate --project`.
      - name: check-fresh-app
        # forge check swift runs the plain Swift toolchain in this image.
        env:
          FORGE_SWIFT_DOCKER: swift:6.2
        run: ./scripts/check-fresh-app.sh "$RUNNER_TEMP/fresh-app"
      # The human-only workflow (docs/human-workflow.md): a default app,
      # outside the checkout, changed in Rust and Swift, tested, inspected
      # and its evidence reviewed with the CLI alone. No agent files, no MCP.
      - name: check-human-workflow
        env:
          FORGE_SWIFT_DOCKER: swift:6.2
        run: ./scripts/check-human-workflow.sh "$RUNNER_TEMP/human-workflow"
      # The headless twin (docs/evidence.md): each app's real view model
      # against its real Rust core, on Linux, judged against the app's
      # requirements.toml. Every example with a requirements.toml is found,
      # not listed, so a new app can't silently skip it (Good Dog pain point
      # 11). Fails on a failed test or a requirement whose test no longer
      # exists. The evidence bundles are kept as an artifact.
      - name: Headless twins
        env:
          FORGE_SWIFT_DOCKER: swift:6.2
        run: |
          set -euo pipefail
          found=0
          for req in examples/*/requirements.toml; do
            app="$(dirname "$req")"
            echo "::group::$app headless twin"
            ./target/debug/forge check swift --project "$app"
            echo "::endgroup::"
            found=$((found + 1))
          done
          [ "$found" -gt 0 ] || { echo "no app has a requirements.toml"; exit 1; }
      # Forge M6.2: exploration aimed at a change, on a model of Good Dog
      # built from its recorded screens (no phone). Fails if the aimed walk
      # stops finding the planted crash, a seed stops repeating, or the
      # fixed crash isn't rechecked.
      - name: Change-aware exploration demo
        run: scripts/demo-m6.2.sh "$RUNNER_TEMP/m6.2-demo"
      - name: Keep the evidence bundles
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: twin-evidence
          path: examples/*/.forge/runs/
          include-hidden-files: true
          if-no-files-found: ignore

  # Cheap policy checks, one job: the minimum supported Rust version still
  # compiles, and dependencies pass advisories, licences, bans and sources.
  policy:
    name: MSRV (1.89) and cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.89
        run: rustup toolchain install 1.89.0 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2
        with:
          tool: cargo-deny
      - name: MSRV check
        run: cargo +1.89.0 check --workspace --all-targets
      - name: cargo deny (advisories, licenses, bans, sources)
        run: cargo deny check
