# Known crossings between the project's areas (docs/areas.md).
# scripts/check-boundaries.sh fails on a crossing that isn't listed here and on
# a listed one that no longer exists, so this list only shrinks.
#
# kind:   "depends" (the default: `from` depends on `to`) or "workspace" (an
#         app crate that is a member of the root Cargo workspace; `to = "root"`)
# to:     a crate name, or "*" for every app crate `from` depends on
# status: "fix" (the default: to be removed; name the plan) or "keep" (an
#         allowed exception, with the reason)

[[crossing]]
from = "device-lab-core"
to = "*"
status = "keep"
reason = "Device Lab is the test bed on the phone and hosts every app (decided 2026-11-15), so it links each app's crate"

[[crossing]]
kind = "workspace"
from = "good-dog-core"
to = "root"
reason = "Good Dog's content core predates app-owned workspaces"
plan = "Step 2 of the boundaries plan: move into examples/good-dog/ as part of Good Dog's own workspace"
