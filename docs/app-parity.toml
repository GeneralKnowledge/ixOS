# Known lag behind the framework, per app and rule (docs/app-parity.md).
# scripts/check-app-parity.sh fails on a lag that isn't listed here and on a
# listed one that has been fixed, so this list only shrinks. Each entry has a
# status: "missing" (the default: the app should use the framework and
# doesn't yet), "deferred" (known work postponed on purpose) or
# "not-applicable" (the app has a real reason for its own plumbing; no wave).
# Missing and deferred entries name the wave of the catch-up plan that
# removes them (0: waiting on a decision).
# Plan: https://claude.ai/artifact/9MTqhUCVKAYVXCrRuAWpeu

[[lag]]
app = "device-lab"
rule = "forge-host"
status = "not-applicable"
reason = "LabModel's state is lab services (sensors, permissions, hosting the other apps), not an app core (decided 2026-11-15)"

[[lag]]
app = "good-dog"
rule = "device-checks"
wave = 4
reason = "GD requirements without a scenario yet; written with GD2b's phone run"

[[lag]]
app = "soundscape"
rule = "requirements"
wave = 4
reason = "Written as the Soundscape and Sketchbook features are finished"

[[lag]]
app = "checklist"
rule = "device-checks"
wave = 4
reason = "CL-3 (background and cancelling) is proved by twin tests only; a phone scenario needs a slow search to interrupt"

[[lag]]
app = "commonplace"
rule = "device-checks"
wave = 4
reason = "CP-5 (error words) needs the fixture server offline, and CP-7 (Stop ends a refresh in Rust) a feed that hangs; written with slice 2"

[[lag]]
app = "relay"
rule = "device-checks"
wave = 4
reason = "CH-12 (Chat's, now Relay's messaging: data held by a second core) is proved by its twin test only; the phone can't open a second core from the UI"

[[lag]]
app = "urdu-naturally"
rule = "device-checks"
wave = 5
reason = "UN-3 (a failed save is an alert) is proved by its twin test only, as the phone can't make a save fail from the UI; UN-5 (pattern practice) gets a phone scenario after its first phone sitting"

[[lag]]
app = "device-lab"
rule = "forge-theme"
status = "not-applicable"
reason = "The lab shell keeps system styling; every hosted app sets its own theme at its own root"

[[lag]]
app = "device-lab"
rule = "resume"
status = "not-applicable"
reason = "Its dashboard reports the phase for its lab services and its transfer test, not a hosted app's model; each hosted app follows its own host"

[[lag]]
app = "device-lab"
rule = "now-playing"
status = "not-applicable"
reason = "AudioMonitor only records interruptions and route changes for the dashboard; it plays nothing"

[[lag]]
app = "weather"
rule = "forge-theme"
status = "deferred"
wave = 0
reason = "Weather draws its own sky colours with white text; whether its few controls take an accent waits for its redesign (ForgeUI coverage audit D3)"

[[lag]]
app = "sketchbook"
rule = "share-file"
status = "not-applicable"
reason = "Its export screen previews the image and offers Save to Photos and Quick Look besides Share; sharing is one action of three, not a ready-to-share step"

[[lag]]
app = "good-dog"
rule = "document"
wave = 4
reason = "Written before Document existed; its own save logic over JsonFile (half-baked audit H10). Moves when Good Dog's store next changes"

[[lag]]
app = "pocket-library"
rule = "document"
wave = 4
reason = "Written before Document existed; JsonFile with its own migration (half-baked audit H10). Moves when the library's schema next changes"

[[lag]]
app = "sums"
rule = "document"
wave = 4
reason = "Saves its history through its own JsonFile (half-baked audit H10). Moves if Sums gets more than the reference's behaviour"
