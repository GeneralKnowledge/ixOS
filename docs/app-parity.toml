# Known lag behind the framework, per app and rule (docs/app-parity.md).
# scripts/check-app-parity.sh fails on a lag that isn't listed here and on a
# listed one that has been fixed, so this list only shrinks. Each entry names
# the wave of the catch-up plan that removes it (0: waiting on a decision).
# Plan: https://claude.ai/artifact/9MTqhUCVKAYVXCrRuAWpeu

[[lag]]
app = "chat"
rule = "appkit-alerts"
wave = 3
reason = "Its own ErrorAlert.swift predates ForgeAppKit"

[[lag]]
app = "chat"
rule = "forge-host"
wave = 3
reason = "Keeps its own state model from before ForgeHost (friction log rank 1)"

[[lag]]
app = "chat"
rule = "forgekit"
wave = 3
reason = "Predates the ForgeKit package; moves with its ForgeHost migration"

[[lag]]
app = "chat"
rule = "forgeui-appearance"
wave = 1
reason = "ForgeUI has no launch appearance helper yet; it moves there with the ForgeKit 0.6 release"

[[lag]]
app = "chat"
rule = "requirements"
wave = 4
reason = "Acceptance lives in examples/chat/ACCEPTANCE.md; becomes requirements with M6"

[[lag]]
app = "chat"
rule = "ui-test"
wave = 4
reason = "Needs the chat server reachable from the phone; comes with M6"

