# Platform gaps found by the NetNewsWire benchmark. Format: ../README.md#gap-records.
# Recorded while building Commonplace slice 1 (2026-11-10), before the
# reference was walked on the phone.

[[gap]]
id = "feed-parsing"
reference = "Reads RSS, Atom and JSON Feed"
ixos_today = "Nothing for feeds; forge-net fetches bytes"
workaround = "The app depends on the feed-rs crate (MIT, pure Rust) in examples/commonplace/rust/src/feed.rs"
missing = "Nothing yet: a third-party crate in the app is the right shape until a second app reads feeds"
layer = "rust"
cost = "small"
blocks = false
second_use = "none yet"

[[gap]]
id = "html-to-reader-text"
reference = "Shows the article's HTML as laid-out text with images and links"
ixos_today = "No shared reader. Pocket Library turns EPUB XHTML into styled text blocks in its own crate (rust/src/epub.rs, model.rs TextBlock)"
workaround = "A small tolerant HTML-to-paragraphs function in the app (feed.rs `paragraphs`); no images, links or styling in the reader"
missing = "The native reader (ForgeReader, capability roadmap Tier 1): a document of blocks with anchors, an HTML importer, and a SwiftUI reading view"
layer = "rust"
cost = "large"
blocks = false
second_use = "Pocket Library (EPUB) is the first; Commonplace is the second, which is what the roadmap waits for"

[[gap]]
id = "http-conditional-fetch"
reference = "Refreshes without downloading unchanged feeds"
ixos_today = "forge-net sends any header and returns status and headers; no cache or validator helper"
workaround = "The app stores ETag and Last-Modified per feed in SQLite and sends If-None-Match / If-Modified-Since itself (lib.rs `fetch`)"
missing = "A conditional-GET helper in forge-net: validators in, NotModified or a body with new validators out"
layer = "rust"
cost = "small"
blocks = false
second_use = "Weather (forecast polling) could use it; not checked"

[[gap]]
id = "concurrent-fetches"
reference = "Refreshes many feeds at once"
ixos_today = "Runtime::run gives one cancellable unit of work on its own thread"
workaround = "Feeds are fetched one after another inside one run; fine for a dozen fixture feeds, slow for hundreds"
missing = "A bounded fan-out for cancellable work (N requests at a time, all stopped together)"
layer = "rust"
cost = "medium"
blocks = false
second_use = "none yet"

