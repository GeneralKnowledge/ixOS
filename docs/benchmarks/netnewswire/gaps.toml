[[gap]]
id = "sqlite-reads-off-the-command-thread"
reference = "Large libraries stay fast"
ixos_today = "forge-storage Database lives on the command thread; queries read a Published snapshot"
workaround = "The whole library (feeds and article rows, without bodies) is re-read into the snapshot after every command; the body is read by a command (open_article)"
missing = "A read-only connection (or paged queries) that queries can use without waiting for commands"
layer = "rust"
cost = "medium"
blocks = false
second_use = "Any app with a large SQLite store; none yet"

