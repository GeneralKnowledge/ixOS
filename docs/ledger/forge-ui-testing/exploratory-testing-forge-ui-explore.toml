limits = "Needs the app's `[ui_test] test_data_args` to change anything; `--real-data` is read-only by an allow list (rows, tabs, back, cancel, plus `[ui_test] real_data_safe`; Linux-tested only, 2026-11-09). Forge apps only (not yet wired to the any-app policy); no scrolling below the fold; one row per list; no invariants or performance checks during the walk. Since M6.1 (2026-11-08, Linux-tested only): `forge_ui_explore` in MCP, a forge.evidence/1 bundle per walk, and the app's log and symbolicated crash reports collected when it closes. Since M6.2 (Linux- and CI-tested on a model only): aimed at a change, issues replayed and compared with the previous walk"
