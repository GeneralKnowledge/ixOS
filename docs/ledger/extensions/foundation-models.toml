order = 65
capability = "Apple Foundation Models (on-device text generation)"
framework = "Yes: `native_services!(ai)` in forge-services (A0, forge-ai-plan.md); the Swift adapter is `ForgeServices+Ai.swift`"
rust_api = "Yes: `AiModel` foreign trait, `AiRequest` (OpenAI chat-completions shaped) and `TextSink`; `HostModel` makes it a `forge_services::ai::LanguageModel`"
ios_native = "Yes: `ForgeAppleModel` (one adapter for every app, replacing Chat's and Pocket Library's own): transcript of real turns, optional permissive guardrails for the user's own text, refusal, context, rate-limit and asset errors mapped, streamed, stops when Rust says so. Not yet compiled after the merge of the two adapters"
in_app = "Yes: Chat's Assistant (L1); Pocket Library's chapter and whole-book summaries (reader, writer, editor and cast-keeper requests over parts that fit the window); Device Lab's AI Lab (timed experiments, structured output through `@Generable` and through `StructuredShape`, a run-time `DynamicGenerationSchema`)"
iphone = "Partial: Chat L1 on iPhone 15 Pro Max, iOS 26.3.1, free team (2026-11-08, ada3d23): streaming (first words 0.6-1.4 s), Stop, interrupted answers and airplane mode passed; characters wrote both sides and then refused (fixed in #104, rechecked on ba45825: in character, no refusals); characters now write requested content in their own voice (#113, rechecked on 90905a0). AI Lab, same phone, 2026-11-17 (combined Device Lab build with #277): all six experiments finished; first text 0.40-1.87 s, about 40-75 tokens a second, the app's memory up by at most 10 MB, thermal state normal throughout; `@Generable` (built with xtool on Linux) and the no-macro schema both returned typed answers (3.70 s and 2.24 s). Stop part-way through Long Answer worked (Reuben, 2026-11-17); the unavailable state was not exercised"
documented = "Partial: forge-ai-plan.md, local-ai.md, Chat ACCEPTANCE.md (L1), Pocket Library README and rust/src/summary.rs"
limits = "iOS 26 with Apple Intelligence on; 4,096-token context; Apple's guardrails can refuse; typed answers through `@Generable` (xtool expands it with its open macro server) or `DynamicGenerationSchema`; `ForgeAppleModel` itself is plain text only"
