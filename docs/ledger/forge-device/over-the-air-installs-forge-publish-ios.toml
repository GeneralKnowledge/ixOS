order = 71
capability = "Over-the-air installs of development builds over Tailscale: one Install page with every build by branch and commit (`forge publish ios`)"
framework = "Yes: forge-cli (publish.rs): xtool signs an .ipa with no phone, Forge keeps the newest builds of each app with an itms-services manifest each and one page, serves them on 127.0.0.1 (a systemd user service with `forge publish enable`) and publishes them with `tailscale serve`"
rust_api = "n/a"
ios_native = "Yes: iOS installs from an itms-services:// link in Safari"
in_app = "Yes: each published build gets a unique CFBundleVersion and its commit, branch and time in the Info.plist; ForgeKit ForgeBuildInfo reads them (Device Lab: Apps > This Build)"
iphone = "No: with a free team, never seen to install a build. 2026-11-15 a first install (Weather) failed with Unable to Install; 2026-11-16 updates of a cable-installed Device Lab (455a445, 98c282e) downloaded in full on Cati (iOS 26.3.1) but left the old build (This Build unchanged). The 2026-11-14 and 2026-11-15 results counted as updates checked only the profile expiry, which an attempt replaces without replacing the app"
documented = "Yes: over-the-air.md"
limits = "Parked: with a free team iOS installs neither new apps nor updates from the page (likely a free-team limit, not yet proven from the install log); install with forge run ios over the cable. A paid team is untested. Logs, crashes and UI tests need the cable anyway. Needs Tailscale with MagicDNS and HTTPS certificates, and the laptop awake"
