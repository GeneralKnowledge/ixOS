order = 120
capability = "Background refresh and processing tasks"
framework = "Yes: forge-services optional service `background`; `[ios] background_tasks` in forge.toml"
rust_api = "Yes: `BackgroundService` (`register_refresh`, `register_processing`, `register_handler`, `schedule`, `cancel`), async handlers, `BackgroundTaskRun` cancellation"
ios_native = "Yes: `ForgeBackgroundScheduler` (`BGTaskScheduler`), registered at launch; `ForgeLifecycle` opens the core when iOS launches the app in the background. Apps hosted in one process (Device Lab) register each identifier once, and each task goes to the app whose Rust handles it"
in_app = "Partial: Commonplace hourly feed refresh, which can notify about new articles; Chat's catch-up every 15 minutes or so, which fetches every room, sends the outbox and announces new messages"
iphone = "No"
documented = "Partial: native-services.md, app-config.md"
limits = "iOS decides when they run, and never after a force-quit or with Background App Refresh off. Forcing a run needs Xcode's debugger. Chat's handler needs its core open, so a refresh after iOS ended the app runs only once the app has opened again (until Chat moves to ForgeHost). Compiled on macOS CI only so far"
