order = 15
capability = "Requests through URLSession (system proxy, VPN, HTTP/3, Low Data Mode)"
framework = "Yes: forge-services `http`"
rust_api = "Yes: `HttpService::prefer_installed` (a `forge_net::HttpClient`; ureq fallback before install and off iOS)"
ios_native = "Yes: `ForgeHTTPTransport` (`URLSession` data and upload tasks, streamed bodies)"
in_app = "Yes: Commonplace (feed fetches), Chat (requests and its live event stream), Soundscape Listen (its take server)"
iphone = "Partial: Commonplace refresh through URLSession, and airplane mode reported as offline, iPhone 15 Pro Max, iOS 26.3.1, 2026-11-11; Soundscape Listen loading songs from its take server over Tailscale in Device Lab (after the ATS exception), reported working by a person, iPhone 15 Pro Max, iOS 26.3.1, 2026-11-16; Chat's stream through URLSession not yet run on a phone"
documented = "Partial: native-services.md"
limits = "Ordinary responses are buffered (up to the client's limit) before Rust gets them; streams are read as they arrive. App Transport Security applies (plain http is refused, numeric IP addresses included: Soundscape and Device Lab set NSAllowsArbitraryLoads for the take server). A request can turn redirect following off (`Request::follow_redirects(false)`, URLSession's redirect delegate and ureq's `max_redirects(0)`), so the 3xx answer comes back for the app to check: Commonplace's full articles use it; not yet run on a phone"
