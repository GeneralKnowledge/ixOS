order = 60
capability = "Peer-to-peer transfer with resume"
framework = "No"
rust_api = "Partial: Relay's core sends notes and files, SHA-256 checked"
ios_native = "No"
in_app = "Partial: Relay's Rust core, the `relay` command on Linux (`relay send PATH...`, `relay receive <code>`, found by mDNS), and Relay's SwiftUI app in Device Lab (QR-paired send; Send and Receive with a word code over iroh for several files, photos or a folder, with progress, kept in the history, received files in the Files app; notes, files and folders to a trusted device with no code over `relay/device/1`, after trusting it following a code transfer)"
iphone = "Partial: Relay in Device Lab on Cati (iOS 26.3.1), 2026-11-15, reported by Reuben: a 200 MB file sent from Linux with a word code arrived at the first try, every chunk checked (BLAKE3), 15.9 MB/s over Wi-Fi (research/relay-stage0-spike.md). iPhone to Linux with a word code also passed on 2026-11-15. Folders, photos, resume after a relaunch, the Files app and the QR-paired path not yet run on a phone. Trusted devices passed on 2026-11-17 (Device Lab build 1.29915595, reported by Reuben): after a code transfer the laptop trusted the iPhone, then a note and a file went laptop to iPhone with no code. Phone-to-laptop with no code and revoking not yet run on a phone"
documented = "No"
limits = "Word-code transfers resume from the device's store, also after a relaunch (tested on Linux); QR-paired transfers don't resume yet and still use TCP (trusted devices on iroh replace them). Trusted-device sends don't resume after a relaunch yet (the delivery outbox). Local network only (relays off); one send and one receive at a time; Bonjour in Swift; the app listens only while on screen"
