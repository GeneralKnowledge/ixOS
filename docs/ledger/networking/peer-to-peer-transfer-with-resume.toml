capability = "Peer-to-peer transfer with resume"
framework = "No"
rust_api = "Partial: Relay's core sends notes and files, SHA-256 checked"
ios_native = "No"
in_app = "Partial: Relay's Rust core, the `relay` command on Linux (`relay send PATH...`, `relay receive <code>`, found by mDNS), and Relay's SwiftUI app in Device Lab (QR-paired send; Send and Receive with a word code over iroh for several files, photos or a folder, with progress, kept in the history, received files in the Files app; notes, files and folders to a trusted device with no code over `relay/device/1`, after trusting it following a code transfer)"
iphone = "Partial: Relay in Device Lab on Cati (iOS 26.3.1), 2026-11-15, reported by Reuben: a 200 MB file sent from Linux with a word code arrived at the first try, every chunk checked (BLAKE3), 15.9 MB/s over Wi-Fi (research/relay-stage0-spike.md). iPhone to Linux with a word code also passed on 2026-11-15. Then on Device Lab 1.29915393, 2026-11-17, reported by Reuben: a folder from Linux arrived and showed in the Files app and the history; photos went iPhone to Linux as one folder; a 1 GB file resumed after Relay was swiped away (\"Resuming: 510.9 MB already here\") and finished, peak memory 74.6 MB. The QR-paired path not yet run on a phone. Trusted devices passed on 2026-11-17 (Device Lab build 1.29915595, reported by Reuben): after a code transfer the laptop trusted the iPhone, then a note and a file went laptop to iPhone with no code. Phone to laptop with no code passed the same evening (two notes received by `relay listen`); revoking not yet run on a phone. Received files kept once passed on Device Lab 1.29916766, 2026-11-18, reported by Reuben: a 200 MB trusted-device send from Linux grew Device Lab by about 200 MB, not 400, and a second identical send also arrived"
documented = "No"
limits = "Word-code transfers resume from the device's store, also after a relaunch (tested on Linux); QR-paired transfers don't resume yet and still use TCP (trusted devices on iroh replace them). Notes and files for a trusted device wait in a delivery outbox while it is away: saved across relaunches (files copied into the store), sent oldest first when it is seen or connects, or on a backoff, and received once (the receiver remembers each item's id for 45 days); pending items end after 30 days, or as No longer trusted when it is revoked; only while Relay is open (tested on Linux, not yet on a phone). Each trusted device is also a text conversation in Chats on chat-core's engine and outbox, delivered once and in order through the same scheduler (tested on Linux, not yet on a phone). Trusted devices are dialled by a resolver (M2 PR 6): what Bonjour sees, the addresses each device told the other when they last met (its Tailscale address too) and where it was last reached, local first, then private (Tailscale), then internet, limited by a Connections setting; each keeps its port across relaunches, the last route is shown per device and, when one does not answer, the reason in words (tested on Linux, not yet on a phone; the 5G-over-Tailscale check waits for a phone sitting). Relay's own servers are a setting (`relay servers`), off until set: with a lookup server, each device publishes a record signed by its key that names only its relay and public addresses (never home-network, Tailscale or loopback ones, which go only to trusted devices), and a trusted device it never met on a network is found by key alone (tested on Linux against an in-process pkarr server and plain-HTTP relay); with a relay, connections no direct route reaches go through it; Connections limits which routes are used, relay included. A change of network retries what waits at once. Relay and lookup servers run on Hetzner over plain HTTP (no domain or TLS yet), unused unless set; one send and one receive at a time; Bonjour in Swift; the app listens only while on screen. A received file is kept once: receiving the same content under the same name again reuses the saved file (a different file with that name gets `name (2)`), and the blob store drops its copy once the file is saved (a named tag per receive keeps it until then, and lets go after 7 days if the transfer never resumes)"
