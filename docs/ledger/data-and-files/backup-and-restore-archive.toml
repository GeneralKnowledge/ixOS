order = 40
capability = "Backup and restore archive"
framework = "Yes: forge-storage `backup` feature (`Backup`, `restore`, `replace_directory`)"
rust_api = "Yes: `Backup::new(app, schema_version, now)` with `.file`, `.bytes`, `.directory`, `.database`, `.write(out)`; `read_manifest`; `restore(archive, app, max_schema_version, into)`; `replace_directory(data_dir, restored, now_ms)`"
ios_native = "n/a: the archive is a file; the app shares it with `ShareLink` and picks one with `.fileImporter`"
in_app = "No"
iphone = "No"
documented = "Yes: persistence.md"
limits = "Zip with a JSON manifest (app, format, schema version, SHA-256 per file); databases are copied with `VACUUM INTO`. Restore refuses another app's archive, a newer schema, unsafe names, wrong sizes or hashes, and more than 4 GiB. Not encrypted. No app uses it yet; tested on Linux only"
