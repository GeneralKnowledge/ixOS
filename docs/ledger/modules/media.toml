order = 100
module = "Media"
layer = "Core"
crate = "`ForgeImages` (`forge-services/swift/helpers`, copied into every iOS app)"
provides = "Thumbnails from a file, data or a web address (`ForgeWebData`: HTTP cache headers, disk copy used offline, 20 MB limit, downloads shared while in flight), memory cache, `ForgeRemoteImage` view in place of AsyncImage, downscaled metadata-free JPEG, all off the main thread"
native_apis = "ImageIO, URLSession (own URLCache, delegate data tasks)"
dependencies = "None"
ios = "Partial: Relay (chat attachments) and Pocket Library use it; web pictures (Pocket Library covers, Soundscape artwork, Commonplace article images) not yet run on a phone"
android = "No"
desktop = "No"
status = "Experimental"
exercised_by = "Relay (chat attachments), Pocket Library, Soundscape, Commonplace"
