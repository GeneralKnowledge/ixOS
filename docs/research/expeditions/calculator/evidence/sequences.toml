# Calculator expedition, R1: the sequence table.
# Each sequence starts from a cleared calculator (All Clear twice) and presses
# keys by their identifier (R0 findings 1 and 2). After the last key, the
# display and the "Last Expression" line are read from the tree, in portrait
# (finding 5: in landscape they are not in the tree).
#
# Key ids: Zero..Nine, Decimal, Add, Subtract, Multiply, Divide, Equals,
# Percent, Negate, Delete, AllClear. Delete's label is "Delete", a commit
# word, so at `operate` Forge asks before tapping it and refuses with nobody
# at a terminal. To run unattended, Calculator is at `full` in the person's
# policy file (Reuben, 2026-11-18): no commit gate for this one app.
#
# `why` says what each sequence asks. Nothing here says what the answer
# should be: the reference decides that.

[[sequence]]
name = "add"
why = "ordinary addition"
keys = ["Seven", "Add", "Five", "Equals"]

[[sequence]]
name = "subtract-below-zero"
why = "a negative result"
keys = ["Nine", "Subtract", "One", "Two", "Equals"]

[[sequence]]
name = "multiply"
why = "ordinary multiplication"
keys = ["Six", "Multiply", "Seven", "Equals"]

[[sequence]]
name = "divide-exact"
why = "a whole result"
keys = ["Eight", "Divide", "Two", "Equals"]

[[sequence]]
name = "divide-third"
why = "how many digits a recurring decimal shows"
keys = ["One", "Divide", "Three", "Equals"]

[[sequence]]
name = "divide-two-thirds"
why = "rounding of the last digit"
keys = ["Two", "Divide", "Three", "Equals"]

[[sequence]]
name = "divide-seventh"
why = "a long non-recurring-looking decimal"
keys = ["One", "Divide", "Seven", "Equals"]

[[sequence]]
name = "point-one-plus-point-two"
why = "the classic floating-point trap (0.30000000000000004?)"
keys = ["Decimal", "One", "Add", "Decimal", "Two", "Equals"]

[[sequence]]
name = "point-without-zero"
why = "does Point on its own show 0."
keys = ["Decimal", "Five"]

[[sequence]]
name = "trailing-zero"
why = "is a typed trailing zero kept before equals"
keys = ["Three", "Decimal", "Zero"]

[[sequence]]
name = "double-point"
why = "a second Point is ignored or not"
keys = ["One", "Decimal", "Decimal", "Five"]

[[sequence]]
name = "leading-zeros"
why = "leading zeros are dropped"
keys = ["Zero", "Zero", "Seven"]

[[sequence]]
name = "repeat-equals-add"
