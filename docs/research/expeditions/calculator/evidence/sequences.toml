keys = ["Two", "Add", "Three", "Equals", "Equals", "Equals"]

[[sequence]]
name = "repeat-equals-multiply"
why = "repeated equals with multiplication"
keys = ["Two", "Multiply", "Three", "Equals", "Equals"]

[[sequence]]
name = "precedence"
why = "is 2 + 3 x 4 equal to 14 or 20"
keys = ["Two", "Add", "Three", "Multiply", "Four", "Equals"]

[[sequence]]
name = "precedence-reversed"
why = "2 x 3 + 4"
keys = ["Two", "Multiply", "Three", "Add", "Four", "Equals"]

[[sequence]]
name = "change-operator"
why = "pressing a second operator replaces the first"
keys = ["Five", "Add", "Multiply", "Two", "Equals"]

[[sequence]]
name = "operator-first"
why = "an operator with nothing before it"
keys = ["Add", "Three", "Equals"]

[[sequence]]
name = "equals-alone"
why = "equals on a cleared calculator"
keys = ["Equals"]

[[sequence]]
name = "chain-after-equals"
why = "carrying on from a result"
keys = ["Two", "Add", "Three", "Equals", "Add", "One", "Equals"]

[[sequence]]
name = "new-number-after-equals"
why = "typing a digit after a result starts again"
keys = ["Two", "Add", "Three", "Equals", "Four"]

[[sequence]]
name = "percent-alone"
why = "50 %"
