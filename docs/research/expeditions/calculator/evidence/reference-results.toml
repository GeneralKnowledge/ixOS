# Calculator's answers to evidence/sequences.toml, recorded on Cati (iPhone 15 Pro Max, iOS 26.3.1)
# on 2026-11-18 with run_sequences.py: pass a (16:21, 31 sums, stopped by the home screen) and
# pass a2 (16:32, the last 8, --start-at digit-limit). One recording each: no second pass (Reuben).
# `display` is the main display and `expression` the "Last Expression" line, every U+200E removed.
# The raw display carries U+200E before each part ("\u200e-\u200e3", "\u200e(\u200e-\u200e5\u200e)"),
# except "Undefined" and "Indeterminate", which have none.

