[workspace]
resolver = "2"
members = [
    "crates/forge-storage",
    "crates/forge-net",
    "crates/forge-runtime",
    "crates/forge-services",
    "examples/chat-core",
    "examples/chat-server",
    "examples/chat-cli",
    "crates/forge-cli",
    "crates/uniffi-bindgen",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
forge-storage = { path = "crates/forge-storage" }
forge-net = { path = "crates/forge-net" }
forge-runtime = { path = "crates/forge-runtime" }
forge-services = { path = "crates/forge-services" }
chat-core = { path = "examples/chat-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uniffi = { version = "0.32.2", features = ["cli"] }

[workspace.metadata.uniffi]
version = "0.32.2"
