[workspace]
resolver = "2"
members = [
    "crates/forge-core",
    "crates/forge-storage",
    "crates/forge-ffi",
    "crates/forge-cli",
    "crates/uniffi-bindgen",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
forge-core = { path = "crates/forge-core" }
forge-storage = { path = "crates/forge-storage" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uniffi = { version = "0.32.2", features = ["cli"] }

[workspace.metadata.uniffi]
version = "0.32.2"
