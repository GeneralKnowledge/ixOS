[workspace]
resolver = "2"
members = [
    "crates/forge-storage",
    "crates/forge-net",
    "crates/forge-runtime",
    "crates/forge-app",
    "crates/forge-services",
    "crates/forge-reader",
    "crates/forge-native",
    "crates/forge-device",
    "crates/forge-devproto",
    "crates/forge-uitest",
    "crates/forge-crash",
    "examples/good-dog-core",
    "crates/forge-cli",
    "crates/uniffi-bindgen",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.89"

[workspace.dependencies]
forge-storage = { path = "crates/forge-storage" }
forge-net = { path = "crates/forge-net" }
forge-runtime = { path = "crates/forge-runtime" }
forge-app = { path = "crates/forge-app" }
forge-services = { path = "crates/forge-services" }
forge-reader = { path = "crates/forge-reader" }
forge-native = { path = "crates/forge-native" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uniffi = { version = "0.32.2", features = ["cli"] }

[workspace.metadata.uniffi]
version = "0.32.2"

# Every `unsafe` is an exception someone chose: `#[allow(unsafe_code)]` on the
# one function that needs it, with a `// SAFETY:` comment on each block
# (docs/research/unsafe-and-verification.md).
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
